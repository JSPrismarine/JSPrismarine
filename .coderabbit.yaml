chat:
    # Only reply when CodeRabbit is explicitly mentioned.
    auto_reply: false
    art: false
    allow_non_org_members: true
    integrations:
        jira:
            usage: disabled
        linear:
            usage: disabled
knowledge_base:
    code_guidelines:
        filePatterns:
            - AGENTS.md
            - CONTRIBUTING.md
            - files: docs/guide/versioning.md
              applyTo: .changeset/**,packages/**/package.json
            - files: docs/adr/0003-declarative-wire-layouts.md
              applyTo: packages/protocol/**
            - files: docs/data-driven/parity.md
              applyTo: packages/parity/**
            - files: docs/data-driven/data-pipeline.md
              applyTo: packages/bedrock-data/**
            - files: .agents/skills/jsdoc-typescript-docs/SKILL.md
              applyTo: "**/*.ts,**/*.mts"
            - files: .agents/skills/unslop/SKILL.md
              applyTo: "**/*.md"
            - files: .agents/skills/human-docs/SKILL.md
              applyTo: docs/**,**/README.md,CONTRIBUTING.md
            - files: .agents/skills/writing-for-agents/SKILL.md
              applyTo: .agents/**,AGENTS.md
    # Keep upstream context focused on sources this repository consumes.
    linked_repositories:
        - repository: CloudburstMC/Data
          instructions: >-
              Pinned Bedrock data download that packages/bedrock-data generates from. Consult when
              reviewing generated data, palettes, or item and block mappings.
        - repository: Mojang/bedrock-samples
          instructions: >-
              Vanilla Bedrock behavior and resource packs fetched by ensure:bedrock-pack. Consult
              when reviewing entity, item, block, or loot behavior read from packs.
        - repository: GeyserMC/mappings
          instructions: >-
              Java to Bedrock mappings. Consult when reviewing cross-edition translation in
              packages/mapping or world generation parity.
    learnings:
        scope: local
    issues:
        scope: local
    pull_requests:
        scope: local
    jira:
        usage: disabled
    linear:
        usage: disabled
    mcp:
        usage: disabled
    automatic_linking_mode: auto
issue_enrichment:
    planning:
        auto_planning:
            enabled: false
    auto_enrich:
        enabled: true
    labeling:
        auto_apply_labels: false
