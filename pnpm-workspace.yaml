packages:
  - packages/**
  - tools/*
  - addons/*

onlyBuiltDependencies:
  - core-js-pure
  - esbuild
  - scriptc

allowBuilds:
  esbuild: true
  scriptc: true

minimumReleaseAge: 0

# @spyglassmc/core 0.4.58 depends on decompress 4.2.1, which is unmaintained and
# lets a crafted archive escape the output directory through links, sibling-prefix
# paths and setuid modes. @xhmikosr/decompress is the maintained fork with the
# same default export and options, fixed in 11.1.3.
overrides:
  decompress: npm:@xhmikosr/decompress@11.1.4

# Vitest registers its flags in camelCase, so its argument parser read a boolean typed in kebab case,
# such as `--since-last-run`, as taking the next argument, and `vitest run --since-last-run <path>`
# dropped the path filter. The patch declares the kebab spelling too; `scripts/vitest-cli.test.ts`
# checks it. Refresh or drop it when Vitest is upgraded.
patchedDependencies:
  vitest@5.1.2: patches/vitest@5.1.2.patch
