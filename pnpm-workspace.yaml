packages:
  - packages/**
  - tools/*

supportedArchitectures:
  - current
  - linux-x64
  - linux-arm64
  - linux-x64-musl
  - linux-arm64-musl
  - darwin-x64
  - darwin-arm64
  - win32-x64
  - win32-arm64

onlyBuiltDependencies:
  - core-js-pure
  - esbuild
  - scriptc

allowBuilds:
  esbuild: true
  scriptc: true

minimumReleaseAge: 0
