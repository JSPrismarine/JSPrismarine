name: 📦 Install
description: Install dependencies

inputs:
    registry-url:
        description: >-
            Registry setup-node writes an .npmrc for. Only a job that publishes needs one, with
            NODE_AUTH_TOKEN set: the .npmrc reads its token from that variable, and every other job
            gets pnpm's "Failed to replace env in config" warning for it.
        required: false
        default: ''
    all-architectures:
        description: >-
            Install every platform's native packages, not only the runner's. Only a job that
            compiles executables for other platforms needs them: they make the install about four
            times larger.
        required: false
        default: 'false'
    root-only:
        description: >-
            Install only the root package's dependencies and run no install scripts. Enough for a
            job that runs a root tool such as commitlint or Vitest's report merge, and it skips the
            `prepare` hook that fetches and generates the Bedrock data.
        required: false
        default: 'false'

runs:
    using: 'composite'
    steps:
        - name: 🏎️ Setup Node
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
          with:
              registry-url: ${{ inputs.registry-url }}
              node-version-file: '.nvmrc'

        - name: 🏎️ Setup pnpm
          uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
          with:
              run_install: false

        # pnpm's package store, restored before the install so that only packages the lockfile
        # gained since the cached store was saved are downloaded. An exact key is a lockfile the
        # store already holds; the prefix falls back to the newest store for any lockfile.
        #
        # Only Linux caches it, and a job installing every platform's packages or only the root's
        # never saves it, so the entry holds one platform's full install. The macOS and Windows copies, saved when the store held
        # every platform, took half of the repository's 10 GB of cache between them.
        - name: Find the pnpm store
          id: pnpm-store
          shell: bash
          run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

        - name: Restore the pnpm store
          id: pnpm-cache
          if: ${{ runner.os == 'Linux' }}
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
          with:
              path: ${{ steps.pnpm-store.outputs.path }}
              key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
              restore-keys: |
                  ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

        # Every platform scriptc and Biome publish a native package for. A tag checked out by the
        # release recovery may still list them in pnpm-workspace.yaml, so they are added only when
        # absent.
        - name: Install every platform's native packages
          if: ${{ inputs.all-architectures == 'true' }}
          shell: bash
          run: |
              grep -q '^supportedArchitectures:' pnpm-workspace.yaml || cat >> pnpm-workspace.yaml <<'YAML'

              supportedArchitectures:
                - current
                - linux-x64
                - linux-arm64
                - linux-x64-musl
                - linux-arm64-musl
                - darwin-x64
                - darwin-arm64
                - win32-x64
                - win32-arm64
              YAML

        # Frozen, so a pull request whose lockfile does not match its manifests fails here instead
        # of testing dependencies nobody committed.
        - name: Install dependencies
          shell: bash
          env:
              ROOT_ONLY: ${{ inputs.root-only == 'true' && '--ignore-scripts --filter .' || '' }}
          run: |
              # Unquoted on purpose: empty vanishes, and the flags word-split.
              # shellcheck disable=SC2086
              pnpm install --frozen-lockfile --prefer-offline $ROOT_ONLY

        # A pull request never saves the store. Its entry is visible to that pull request alone,
        # and a copy per pull request pushed master's entries, the ones every pull request
        # restores, out of the cache. It downloads the few packages its lockfile adds instead.
        # The prune drops what the restored store held for an older lockfile, so the entry stays
        # the size of one install.
        - name: Drop the packages the lockfile no longer names
          if: ${{ steps.pnpm-cache.outcome == 'success' && steps.pnpm-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && inputs.all-architectures != 'true' && inputs.root-only != 'true' }}
          shell: bash
          run: pnpm store prune

        - name: Save the pnpm store
          if: ${{ steps.pnpm-cache.outcome == 'success' && steps.pnpm-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && inputs.all-architectures != 'true' && inputs.root-only != 'true' }}
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
          with:
              path: ${{ steps.pnpm-store.outputs.path }}
              key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
