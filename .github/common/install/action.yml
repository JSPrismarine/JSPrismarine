name: 📦 Install
description: Install dependencies

inputs:
    registry-url:
        description: >-
            Registry setup-node writes an .npmrc for. Only a job that publishes needs one, with
            NODE_AUTH_TOKEN set: the .npmrc reads its token from that variable, and every other job
            gets pnpm's "Failed to replace env in config" warning for it.
        required: false
        default: ''

runs:
    using: 'composite'
    steps:
        - name: 🏎️ Setup Node
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
          with:
              registry-url: ${{ inputs.registry-url }}
              node-version-file: '.nvmrc'

        - name: 🏎️ Setup pnpm
          uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
          with:
              run_install: false

        # pnpm's package store, restored before the install so that only packages the lockfile
        # gained since the cached store was saved are downloaded. An exact key is a lockfile the
        # store already holds; the prefix falls back to the newest store for any lockfile.
        #
        # Only Linux caches it. The store holds every platform's binaries (`supportedArchitectures`
        # in `pnpm-workspace.yaml`), about 1.6 GB compressed, and the macOS and Windows copies took
        # half of the repository's 10 GB of cache between them for a download that takes as long as
        # the restore did.
        - name: Find the pnpm store
          id: pnpm-store
          shell: bash
          run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

        - name: Restore the pnpm store
          id: pnpm-cache
          if: ${{ runner.os == 'Linux' }}
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
          with:
              path: ${{ steps.pnpm-store.outputs.path }}
              key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
              restore-keys: |
                  ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

        - name: Install dependencies
          shell: bash
          run: pnpm install --no-frozen-lockfile --prefer-offline

        # A pull request never saves the store. Its entry is visible to that pull request alone,
        # and a copy per pull request pushed master's entries, the ones every pull request
        # restores, out of the cache. It downloads the few packages its lockfile adds instead.
        # The prune drops what the restored store held for an older lockfile, so the entry stays
        # the size of one install.
        - name: Drop the packages the lockfile no longer names
          if: ${{ steps.pnpm-cache.outcome == 'success' && steps.pnpm-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' }}
          shell: bash
          run: pnpm store prune

        - name: Save the pnpm store
          if: ${{ steps.pnpm-cache.outcome == 'success' && steps.pnpm-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' }}
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
          with:
              path: ${{ steps.pnpm-store.outputs.path }}
              key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
