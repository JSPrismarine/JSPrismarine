name: 📦 Install
description: Install dependencies

inputs:
    registry-url:
        description: >-
            Registry setup-node writes an .npmrc for. Only a job that publishes needs one, with
            NODE_AUTH_TOKEN set: the .npmrc reads its token from that variable, and every other job
            gets pnpm's "Failed to replace env in config" warning for it.
        required: false
        default: ''

runs:
    using: 'composite'
    steps:
        - name: 🏎️ Setup Node
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
          with:
              registry-url: ${{ inputs.registry-url }}
              node-version-file: '.nvmrc'

        - name: 🏎️ Setup pnpm
          uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
          with:
              run_install: false

        - name: Install dependencies
          shell: bash
          run: pnpm install --no-frozen-lockfile
