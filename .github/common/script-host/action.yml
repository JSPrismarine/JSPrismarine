name: 📜 Script host library
description: >-
    Builds @jsprismarine/script-host's QuickJS library for this runner, which the package's tests
    load. No build of it is published yet, so every Linux x64 job that installs the repository
    builds one, or restores the build of the same native sources from the cache.

runs:
    using: 'composite'
    steps:
        # One build per runner kind and set of sources, shared by every job that needs it.
        - name: ♻️ Restore this runner's build of these sources
          id: cache
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
          with:
              path: packages/script-host/prebuilds
              key: script-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/script-host/native/**', 'packages/script-host/scripts/build-native.mts', 'packages/script-host/src/absentGlobals.ts', 'packages/script-host/src/platform.ts') }}

        - name: 🔨 Build the library
          if: ${{ steps.cache.outputs.cache-hit != 'true' }}
          shell: bash
          run: node packages/script-host/scripts/build-native.mts

        - name: 💾 Save the build
          if: ${{ steps.cache.outputs.cache-hit != 'true' }}
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
          with:
              path: packages/script-host/prebuilds
              key: script-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/script-host/native/**', 'packages/script-host/scripts/build-native.mts', 'packages/script-host/src/absentGlobals.ts', 'packages/script-host/src/platform.ts') }}

        # With the build in place, a suite that cannot load it fails instead of skipping.
        - name: 📌 Require the library in tests
          shell: bash
          run: echo "JSP_SCRIPT_HOST_REQUIRE=1" >> "$GITHUB_ENV"
