# The repository's GitHub label catalog. `.github/workflows/sync-labels.yml` creates and updates
# these labels; it never deletes others.
#
# `ai_apply_when` is read by CodeRabbit alone and tells it when to apply a label to a pull request.
# After editing this file, run `pnpm run labels:coderabbit` to regenerate its instructions in
# `.coderabbit.yaml`. Leave `ai_apply_when` off a label a person or another bot manages. "Dependency"
# starts the workflow that commits a changeset to the pull request, so CodeRabbit never applies it.

- name: "Beginner"
  color: "fbca04"
  description: "Good issue for somewhat new contributors"

- name: "Bug"
  color: "d73a4a"
  description: "Something not working as it should or even going terribly wrong"
  ai_apply_when: "Fixes incorrect or broken behavior."

- name: "Dependants"
  color: "4ADECD"
  description: "Issues and bugs for people leveraging us as dependency"
  ai_apply_when: "Changes the public API or published behavior of an npm package that other projects consume."

- name: "Dependency"
  color: "ededed"
  description: "PRs and issues related to the packages we depend on"

- name: "Developer Experience"
  color: "44E11C"
  description: "Things related to making our development easier"
  ai_apply_when: "Changes to repository tooling, scripts, linting, test infrastructure, agent skills or the contributor workflow."

- name: "DevOps"
  color: "ededed"
  description: "Deployments of websites, example servers etc"
  ai_apply_when: "Changes to deployments, the docs site publish, the Docker image, release automation or executable packaging."

- name: "Documentation"
  color: "0075ca"
  description: "Improvements, additions or issues  in our documentation"
  ai_apply_when: "Documentation, guides, READMEs or generated references are a primary part of the change."

- name: "Duplicate"
  color: "cfd3d7"
  description: "Already brought up in a previous issue (please use the search function before submitting an issue)"

- name: "Enhancement"
  color: "a2eeef"
  description: "New feature or request that aren’t blocking and would just be “nice to have”"
  ai_apply_when: "Adds a user-facing feature, gameplay behavior or capability."

- name: "Good First Issue"
  color: "7057ff"
  description: "Perfect for newcomers"

- name: "hacktoberfest-accepted"
  color: "FDB50E"

- name: "Help Wanted"
  color: "AD75A3"
  description: "A pair of extra hands and attention is needed to solve this issue or get this PR ready"

- name: "Invalid"
  color: "e4e669"
  description: "Something about this doesn't seem right"

- name: "Low Priority"
  color: "f3ffaf"
  description: "There are more pressing blockers to deal with first"
  ai_apply_when: "Use only when low priority is explicitly established; do not infer it from the diff."

- name: "Nethernet"
  color: "ed1e1f"
  description: "Related to nethernet/webrtc"
  ai_apply_when: "Changes to packages/nethernet/ or the NetherNet (WebRTC) transport."

- name: "Networking"
  color: "315478"
  description: "Raknet and general networking features or issues"
  ai_apply_when: "Changes to packages/raknet/, connection handling, sessions or other transport-level networking."

- name: "Performance"
  color: "0E7F06"
  description: "Any issue or feature related to performance, no matter if it’s network, tick, etc"
  ai_apply_when: "Changes made to reduce CPU, memory, allocations, network traffic or tick cost; pair with Bug when fixing a performance regression."

- name: "Protocol"
  color: "CB2A7C"
  description: "Minecraft Bedrock Edition protocol changes and updates"
  ai_apply_when: "Changes to packages/protocol/, packet wire layouts, or support for a Bedrock protocol version."

- name: "Question"
  color: "d876e3"
  description: "User wanted more information"

- name: "RFC"
  color: "1d76db"
  description: "Request for comments"

- name: "Security"
  color: "d93f0b"
  description: "Security or privacy issue"
  ai_apply_when: "Fixes a vulnerability, unsafe input handling or authentication weakness, or hardens the server against one."

- name: "Slop"
  color: "ff0000"
  description: "Low-effort AI-generated content, applied by CodeRabbit's slop detection"
  ai_apply_when: "Managed by slop detection; do not suggest from style or wording alone."

- name: "Stale"
  color: "BFD4F2"
  description: "This PR has not had any recent activity or response from the author"

- name: "Tests"
  color: "7C64F0"
  description: "Testing related issues/PRs."
  ai_apply_when: "Tests, fixtures, the parity suite or client e2e scenarios are a primary part of the change."

- name: "Unconfirmed"
  color: "1FD145"
  description: "The behavior is not reproducible"

- name: "Waiting On Author"
  color: "5319e7"
  description: "We need more information from the original author"
  ai_apply_when: "Use only when the PR explicitly needs information or changes from its author."

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "Work In Progress"
  color: "7DB2F3"
  description: "Somebody has taken ownership of this issue and is currently working on it"

- name: "⛔ PR Is Blocked"
  color: "B60205"
  description: "PR is blocked by something outside of the author's control, protected from stalebot"
  ai_apply_when: "Use only when the PR is explicitly blocked by an unresolved decision or another change."
