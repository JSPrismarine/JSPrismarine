name: Release

on:
    push:
        branches:
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

env:
    NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    # setup-node writes an .npmrc that reads its token from NODE_AUTH_TOKEN, so the
    # unstable publish step authenticates through it directly instead of relying
    # on the .npmrc changesets/action happens to leave behind.
    NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    NPM_CONFIG_PROVENANCE: true
    GITHUB_TOKEN: ${{ secrets.MACHINE_USER }}
    HUSKY: 0

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write

jobs:
    release:
        name: 🚚 Release
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.changesets.outputs.published }}
            shared_version: ${{ steps.shared_version.outputs.version }}
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  submodules: 'recursive'
                  # Persist the machine-user PAT (not the default GITHUB_TOKEN) so the
                  # version branch pushed by changesets/action is attributed to a real
                  # user. Pushes made by github-actions[bot] do NOT trigger downstream
                  # workflows, which is why CI never ran on the autogenerated release PR.
                  token: ${{ secrets.MACHINE_USER }}

            - name: 🧬 Update submodules
              run: git submodule update --init --recursive

            - name: 📦 Install
              uses: ./.github/common/install

            - name: 🔨 Build
              run: pnpm run build

            - name: 🤝 Create Release Pull Request or Publish to NPM
              id: changesets
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  # GitHub rejects release bodies longer than 125,000 characters.
                  # Create bounded releases in the next step instead.
                  create-github-releases: false
                  push-git-tags: true
                  version-script: pnpm run version
                  publish-script: pnpm run release
                  push-with-git-cli: true
                  commit-message: |
                      chore(changeset): release packages

                      Congratulations on the new release! 🎉
                      This is an automated commit triggered by the `release` workflow.
                  pr-title: 🚀 Release packages
                  github-token: ${{ secrets.MACHINE_USER }}

            - name: 🔢 Capture shared version
              id: shared_version
              if: steps.changesets.outputs.published == 'true'
              env:
                  PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
              run: |
                  node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
                  const publishedPackages = JSON.parse(process.env.PUBLISHED_PACKAGES);
                  const serverPackage = publishedPackages.find(({ name }) => name === '@jsprismarine/server');
                  if (!serverPackage) {
                      throw new Error('Published packages do not include @jsprismarine/server');
                  }
                  console.log(`version=${serverPackage.version}`);
                  NODE

            - name: 📝 Create GitHub Releases
              if: steps.changesets.outputs.published == 'true'
              env:
                  PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
              run: node .github/scripts/create-github-releases.mjs

            - name: 🫨 Create Unstable Release
              if: steps.changesets.outputs.published != 'true'
              run: |
                  git checkout master
                  pnpm run version:unstable
                  pnpm run release:unstable

    aot-build:
        name: 🗃️ Build standalone executables (${{ matrix.group }})
        needs: release
        if: ${{ needs.release.result == 'success' && needs.release.outputs.published == 'true' }}
        strategy:
            matrix:
                include:
                    - runner: ubuntu-latest
                      group: linux
                      targets: >-
                          bun-linux-x64
                          bun-linux-arm64
                          bun-linux-x64-musl
                          bun-linux-arm64-musl
                    - runner: macos-latest
                      group: macos
                      targets: >-
                          bun-darwin-x64
                          bun-darwin-arm64
                    - runner: windows-latest
                      group: windows-x64
                      targets: bun-windows-x64
                    - runner: windows-11-arm
                      group: windows-arm64
                      targets: bun-windows-arm64
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
        env:
            BUILD_TYPE: release
            RELEASE_VERSION: ${{ needs.release.outputs.shared_version }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  submodules: 'recursive'

            - name: 📦 Install
              uses: ./.github/common/install

            # Keep installation and the lockfile on pnpm; Bun only compiles the executables.
            - name: 🐰 Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: canary

            - name: 🏷️ Set build metadata
              run: node .github/scripts/set-build-metadata.mjs

            - name: 🗃️ Compile executables
              env:
                  BUILD_TARGETS: ${{ matrix.targets }}
              shell: bash
              run: |
                  mkdir -p dist
                  for target in $BUILD_TARGETS; do
                      output="dist/prismarine-${target#bun-}"
                      node .github/scripts/build-aot.mjs "$target" "$output"
                      if [[ "$target" == bun-darwin-* ]]; then
                          architecture="${target##*-}"
                          node .github/scripts/package-macos-app.mjs "$output" "$architecture"
                      fi
                  done

            - name: 🚚 Upload executable artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: prismarine-${{ matrix.group }}
                  path: |
                      dist/prismarine-*
                      dist/JSPrismarine-*.app.zip
                  if-no-files-found: error

    aot-release:
        name: 📦 Publish standalone executables
        needs: [release, aot-build]
        if: ${{ always() && needs.release.result == 'success' && needs.release.outputs.published == 'true' && needs.aot-build.result == 'success' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.MACHINE_USER }}
            RELEASE_VERSION: ${{ needs.release.outputs.shared_version }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: 📥 Download executable artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: dist
                  merge-multiple: true

            - name: 📝 Generate release highlights
              run: node .github/scripts/generate-release-highlights.mjs > dist/highlights.md

            - name: 🚚 Publish standalone release
              run: |
                  tag="jsprismarine@${RELEASE_VERSION}"
                  title="JSPrismarine ${RELEASE_VERSION}"
                  if gh release view "$tag" >/dev/null 2>&1; then
                      gh release edit "$tag" --title "$title" --notes-file dist/highlights.md --latest
                      gh release upload "$tag" dist/prismarine-* dist/JSPrismarine-*.app.zip dist/highlights.md --clobber
                  else
                      gh release create "$tag" \
                          dist/prismarine-* \
                          dist/JSPrismarine-*.app.zip \
                          dist/highlights.md \
                          --target "$GITHUB_SHA" \
                          --title "$title" \
                          --latest \
                          --notes-file dist/highlights.md
                  fi
