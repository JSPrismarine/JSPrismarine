name: Release

on:
    push:
        branches:
            - master
    # Refreshes the release pull request with the changesets that landed since the last refresh. A
    # push to master only publishes, or opens the release pull request when there is none, because
    # rewriting it after every push started a full set of checks on it each time.
    schedule:
        - cron: '23 */6 * * *'
    # Recovery: rebuild and republish the standalone executables of a release whose later jobs
    # failed after the packages were already published. Run it from the branch whose build
    # scripts work; it builds the source of the release's tag. See scripts/recover-release.mjs.
    workflow_dispatch:
        inputs:
            recover-version:
                description: 'The published JSPrismarine version to build executables for, such as 0.17.1'
                required: true
                type: string

# Let an active release finish because it may publish packages or create a release.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

env:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master
    NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    # setup-node writes an .npmrc that reads its token from NODE_AUTH_TOKEN, so the
    # unstable publish step authenticates through it directly instead of relying
    # on the .npmrc changesets/action happens to leave behind.
    NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    NPM_CONFIG_PROVENANCE: true
    GITHUB_TOKEN: ${{ secrets.MACHINE_USER }}
    HUSKY: 0

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write

jobs:
    release:
        name: 🚚 Release
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.changesets.outputs.published }}
            shared_version: ${{ steps.shared_version.outputs.version }}
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
            # Publishing to GitHub Packages.
            packages: write
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  # No old file contents, which are nearly all of the repository's 2 GB.
                  # Git fetches a blob a command needs on demand.
                  filter: blob:none
                  # Persist the machine-user PAT (not the default GITHUB_TOKEN) so the
                  # version branch pushed by changesets/action is attributed to a real
                  # user. Pushes made by github-actions[bot] do NOT trigger downstream
                  # workflows, which is why CI never ran on the autogenerated release PR.
                  token: ${{ secrets.MACHINE_USER }}

            # Pending changesets make the changesets step open or update the release pull request;
            # none make it publish. A push publishes, or opens the release pull request when none is
            # open. The schedule only updates the release pull request, and never publishes.
            - name: 🔎 Decide what the changesets step does
              id: plan
              env:
                  EVENT: ${{ github.event_name }}
                  # Not GITHUB_TOKEN, which this workflow sets to the machine user's token.
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  pending=false
                  if [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
                      pending=true
                  fi
                  open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head changeset-release/master --state open --json number --jq length)"
                  run=false
                  if [ "$EVENT" = schedule ]; then
                      [ "$pending" = true ] && run=true
                  elif [ "$pending" = false ] || [ "$open" = 0 ]; then
                      run=true
                  fi
                  echo "Pending changesets: $pending. Open release pull requests: $open. Run changesets: $run."
                  echo "run=$run" >> "$GITHUB_OUTPUT"

            - name: 📦 Install
              if: ${{ steps.plan.outputs.run == 'true' || github.event_name == 'push' }}
              uses: ./.github/common/install
              with:
                  registry-url: 'https://registry.npmjs.org/'

            - name: 🔨 Build
              if: ${{ github.event_name == 'push' }}
              run: pnpm run build

            - name: 🤝 Create Release Pull Request or Publish to NPM
              id: changesets
              if: ${{ steps.plan.outputs.run == 'true' }}
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  # GitHub rejects release bodies longer than 125,000 characters.
                  # Create bounded releases in the next step instead.
                  create-github-releases: false
                  push-git-tags: true
                  version-script: pnpm run version
                  # A scheduled run only refreshes the release pull request. Without a publish
                  # script the action publishes nothing, even if it reads no changesets where the
                  # check above found one.
                  publish-script: ${{ github.event_name == 'push' && 'pnpm run release' || '' }}
                  push-with-git-cli: true
                  commit-message: |
                      chore(changeset): release packages

                      Congratulations on the new release! 🎉
                      This is an automated commit triggered by the `release` workflow.
                  pr-title: 🚀 Release packages
                  github-token: ${{ secrets.MACHINE_USER }}

            # A release only: the unstable and nightly builds stay on npm. It does not block the
            # executables below when GitHub Packages is down; the step's error shows on the run, and
            # `publish-github-packages.mjs` skips versions that are already there, so it can be rerun.
            - name: 📦 Publish to GitHub Packages
              if: steps.changesets.outputs.published == 'true'
              continue-on-error: true
              env:
                  PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
                  # Not GITHUB_TOKEN, which this workflow sets to the machine user's token.
                  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node .github/scripts/publish-github-packages.mjs

            - name: 🔢 Capture shared version
              id: shared_version
              if: steps.changesets.outputs.published == 'true'
              env:
                  PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
              run: |
                  node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
                  const publishedPackages = JSON.parse(process.env.PUBLISHED_PACKAGES);
                  const serverPackage = publishedPackages.find(({ name }) => name === '@jsprismarine/server');
                  if (!serverPackage) {
                      throw new Error('Published packages do not include @jsprismarine/server');
                  }
                  console.log(`version=${serverPackage.version}`);
                  NODE

            - name: 📝 Create GitHub Releases
              if: steps.changesets.outputs.published == 'true'
              env:
                  PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
              run: node .github/scripts/create-github-releases.mjs

            - name: 🫨 Create Unstable Release
              if: github.event_name == 'push' && steps.changesets.outputs.published != 'true'
              run: |
                  git checkout master
                  # `changeset version --snapshot` exits 1 when nothing is pending, such as on the release commit itself.
                  if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
                      echo 'No pending changesets; skipping the unstable release.'
                      exit 0
                  fi
                  pnpm run version:unstable
                  # Rebuild Prismarine after the snapshot version change so its schema URLs match the published package.
                  pnpm --filter @jsprismarine/prismarine run build
                  pnpm run release:unstable

    executables:
        name: 🗃️ Build standalone executables
        needs: release
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || (needs.release.result == 'success' && needs.release.outputs.published == 'true')) }}
        permissions:
            contents: read
        uses: ./.github/workflows/executables.yml
        secrets: inherit
        with:
            build-type: release
            version: ${{ inputs.recover-version || needs.release.outputs.shared_version }}
            # A recovery builds the release's own source with the build scripts of the ref it was
            # started from, since the scripts of the tag are the ones that failed.
            ref: ${{ github.event_name == 'workflow_dispatch' && format('@jsprismarine/server@{0}', inputs.recover-version) || github.sha }}
            recovery: ${{ github.event_name == 'workflow_dispatch' }}
            # scripts/recover-release.mjs reads the targets from this list.
            targets: >-
                [
                    "bun-linux-x64",
                    "bun-linux-arm64",
                    "bun-linux-x64-musl",
                    "bun-linux-arm64-musl",
                    "bun-darwin-arm64",
                    "bun-windows-x64"
                ]

    aot-release:
        name: 📦 Publish standalone executables
        needs: [release, executables]
        if: ${{ always() && needs.executables.result == 'success' }}
        runs-on: ubuntu-latest
        # One publication at a time across every ref: a recovery started from another branch must
        # not read the releases before a release from master lands and then mark Latest after it.
        concurrency:
            group: release-publish-executables
            cancel-in-progress: false
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.MACHINE_USER }}
            RELEASE_VERSION: ${{ inputs.recover-version || needs.release.outputs.shared_version }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  # No old file contents, which are nearly all of the repository's 2 GB.
                  # Git fetches a blob a command needs on demand.
                  filter: blob:none

            - name: 📥 Download executable artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: dist
                  merge-multiple: true

            - name: 📝 Generate release highlights
              run: node .github/scripts/generate-release-highlights.mjs > dist/highlights.md

            # Latest is what the repository's Releases link opens, so it has to be the newest stable
            # executables release. Nightlies are prereleases, which GitHub never marks Latest, and a
            # recovery of an older version leaves Latest where it is.
            - name: 🚚 Publish standalone release
              run: |
                  tag="jsprismarine@${RELEASE_VERSION}"
                  title="JSPrismarine ${RELEASE_VERSION}"
                  # A failed request stops the step here. Read together with the version below, its
                  # failure would leave this version alone in the list, and mark it Latest.
                  # Every page: several nightlies a day would push older stable releases past one.
                  stable="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                      --jq '.[] | select(.prerelease == false and .draft == false and (.tag_name | startswith("jsprismarine@"))) | .tag_name | ltrimstr("jsprismarine@")')"
                  newest="$(printf '%s\n%s\n' "$stable" "$RELEASE_VERSION" | sort -V | tail -n 1)"
                  latest=false
                  if [ "$newest" = "$RELEASE_VERSION" ]; then latest=true; fi
                  echo "Newest stable release: $newest. Mark $tag as Latest: $latest."
                  # A recovery tags the commit the version was published from, not the branch it ran on.
                  target="$GITHUB_SHA"
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      target="$(git rev-list -n 1 "@jsprismarine/server@${RELEASE_VERSION}")"
                  fi
                  if gh release view "$tag" >/dev/null 2>&1; then
                      gh release edit "$tag" --title "$title" --notes-file dist/highlights.md --latest="$latest"
                      gh release upload "$tag" dist/prismarine-* dist/JSPrismarine-*.app.zip dist/highlights.md --clobber
                  else
                      gh release create "$tag" \
                          dist/prismarine-* \
                          dist/JSPrismarine-*.app.zip \
                          dist/highlights.md \
                          --target "$target" \
                          --title "$title" \
                          --latest="$latest" \
                          --notes-file dist/highlights.md
                  fi
