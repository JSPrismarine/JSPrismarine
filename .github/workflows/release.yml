name: Release

on:
    push:
        branches:
            - master
    # Recovery: rebuild and republish the standalone executables of a release whose later jobs
    # failed after the packages were already published. Run it from the branch whose build
    # scripts work; it builds the source of the release's tag. See scripts/recover-release.mjs.
    workflow_dispatch:
        inputs:
            recover-version:
                description: 'The published JSPrismarine version to build executables for, such as 0.17.1'
                required: true
                type: string

# Let an active release finish because it may publish packages or create a release.
# A manual run, which only rebuilds a published release's executables, has a group of its own, so
# a push to master that waits behind the same group cannot replace it.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
    cancel-in-progress: false

env:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master
    NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    # setup-node writes an .npmrc that reads its token from NODE_AUTH_TOKEN, so the
    # unstable publish step authenticates through it directly instead of relying
    # on the .npmrc changesets/action happens to leave behind.
    NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    NPM_CONFIG_PROVENANCE: true
    GITHUB_TOKEN: ${{ secrets.MACHINE_USER }}
    HUSKY: 0

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write

jobs:
    release:
        name: 🚚 Release
        if: ${{ github.event_name == 'push' }}
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.changesets.outputs.published }}
            shared_version: ${{ steps.shared_version.outputs.version }}
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
            # Publishing to GitHub Packages.
            packages: write
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  # No old file contents, which are nearly all of the repository's 2 GB.
                  # Git fetches a blob a command needs on demand.
                  filter: blob:none
                  # Persist the machine-user PAT (not the default GITHUB_TOKEN) so the
                  # version branch pushed by changesets/action is attributed to a real
                  # user. Pushes made by github-actions[bot] do NOT trigger downstream
                  # workflows, which is why CI never ran on the autogenerated release PR.
                  token: ${{ secrets.MACHINE_USER }}

            # A push publishes when the release commit's version is not on npm yet, or when no
            # changesets are pending, which retries a publish that failed partway. It checks the
            # registry rather than the pending changesets, because the commit a release run checks out
            # can still hold changesets: a release pull request rebased onto master carries the ones
            # that landed after its last refresh, and the concurrency group replaces a waiting run with
            # the next push's, so a commit that lands before the release commit's run starts is the
            # one that run checks out. The fixed version group moves @jsprismarine/server with every
            # release, and the release steps below require it, so its version stands for the release.
            #
            # Pending changesets open or update the release pull request on every push, so it holds
            # every changeset on master and merging it leaves none behind. When it was refreshed at
            # most every six hours, the release commit kept the changesets that landed since, and the
            # run that published it opened the next release pull request at once.
            - name: 🔎 Decide what the changesets steps do
              id: plan
              run: |
                  pending=false
                  if [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
                      pending=true
                  fi
                  version="$(jq -r .version packages/server/package.json)"
                  # A 404 is an unpublished version; any other failure stops the release rather than guess.
                  status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/@jsprismarine%2fserver/$version")"
                  case "$status" in
                      200) unpublished=false ;;
                      404) unpublished=true ;;
                      *) echo "::error::npm answered $status for @jsprismarine/server@$version"; exit 1 ;;
                  esac
                  publish=false
                  if [ "$unpublished" = true ] || [ "$pending" = false ]; then
                      publish=true
                  fi
                  echo "Pending changesets: $pending. @jsprismarine/server@$version unpublished: $unpublished. Publish: $publish."
                  {
                      echo "pending=$pending"
                      echo "publish=$publish"
                  } >> "$GITHUB_OUTPUT"

            - name: 📦 Install
              uses: ./.github/common/install
              with:
                  registry-url: 'https://registry.npmjs.org/'

            - name: 🔨 Build
              run: pnpm run build

            # changesets/action publishes only when it finds no changesets, so the ones that landed
            # after the release commit wait outside the tree while it publishes.
            - name: 🙈 Set pending changesets aside
              if: ${{ steps.plan.outputs.publish == 'true' && steps.plan.outputs.pending == 'true' }}
              run: |
                  mkdir -p "$RUNNER_TEMP/changesets"
                  find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -exec mv -t "$RUNNER_TEMP/changesets" {} +

            - name: 🤝 Publish to NPM
              id: changesets
              if: ${{ steps.plan.outputs.publish == 'true' }}
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  # GitHub rejects release bodies longer than 125,000 characters.
                  # Create bounded releases in the next step instead.
                  create-github-releases: false
                  push-git-tags: true
                  publish-script: pnpm run release
                  push-with-git-cli: true
                  github-token: ${{ secrets.MACHINE_USER }}

            - name: 🙉 Restore pending changesets
              if: ${{ always() && steps.plan.outputs.publish == 'true' && steps.plan.outputs.pending == 'true' }}
              run: mv -t .changeset "$RUNNER_TEMP"/changesets/*.md

            # A release only: the unstable and nightly builds stay on npm. It does not block the
            # executables below when GitHub Packages is down; the step's error shows on the run, and
            # `publish-github-packages.mjs` skips versions that are already there, so it can be rerun.
            - name: 📦 Publish to GitHub Packages
              if: steps.changesets.outputs.published == 'true'
              continue-on-error: true
              env:
                  PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
                  # Not GITHUB_TOKEN, which this workflow sets to the machine user's token.
                  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node .github/scripts/publish-github-packages.mjs

            - name: 🔢 Capture shared version
              id: shared_version
              if: steps.changesets.outputs.published == 'true'
              env:
                  PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
              run: |
                  node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
                  const publishedPackages = JSON.parse(process.env.PUBLISHED_PACKAGES);
                  const serverPackage = publishedPackages.find(({ name }) => name === '@jsprismarine/server');
                  if (!serverPackage) {
                      throw new Error('Published packages do not include @jsprismarine/server');
                  }
                  console.log(`version=${serverPackage.version}`);
                  NODE

            - name: 📝 Create GitHub Releases
              if: steps.changesets.outputs.published == 'true'
              env:
                  PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
              run: node .github/scripts/create-github-releases.mjs

            - name: 🫨 Create Unstable Release
              if: steps.changesets.outputs.published != 'true'
              run: |
                  git checkout master
                  # `changeset version --snapshot` exits 1 when nothing is pending, such as on the release commit itself.
                  if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
                      echo 'No pending changesets; skipping the unstable release.'
                      exit 0
                  fi
                  pnpm run version:unstable
                  # Rebuild Prismarine after the snapshot version change so its schema URLs match the published package.
                  pnpm --filter @jsprismarine/prismarine run build
                  pnpm run release:unstable

            # The unstable release's snapshot versioning consumes the changeset files, and
            # changesets/action looks for changesets in the working tree before it resets its branch,
            # so the tree goes back to this run's commit first or the action finds none.
            - name: ⏪ Restore the release commit's files
              if: ${{ !cancelled() && steps.plan.outputs.pending == 'true' }}
              run: git reset --hard "$GITHUB_SHA"

            # A run can wait in the concurrency group long after its push, and its commit's pending
            # changesets may by then be released: when the release pull request merged meanwhile, the
            # steps below would open a new one for a version already published. A newer push has its
            # own run queued behind this one, which opens or updates the pull request from master's tip.
            - name: 🧭 Check master is still this run's commit
              id: tip
              if: ${{ !cancelled() && steps.plan.outputs.pending == 'true' }}
              run: |
                  tip="$(git ls-remote origin refs/heads/master | cut -f1)"
                  current=false
                  if [ "$tip" = "$GITHUB_SHA" ]; then current=true; fi
                  echo "master is at $tip, this run's commit is $GITHUB_SHA. Update the release pull request: $current."
                  echo "current=$current" >> "$GITHUB_OUTPUT"

            # Written while the pending changesets are still in the tree; the next step consumes them.
            - name: 📝 Write the release pull request's body
              if: ${{ !cancelled() && steps.tip.outputs.current == 'true' }}
              run: |
                  pnpm exec changeset status --output "$RUNNER_TEMP/release-plan.json"
                  node .github/scripts/release-pr-body.mjs "$RUNNER_TEMP/release-plan.json" > "$RUNNER_TEMP/release-pr-body.md"

            # Last, since it leaves the checkout on the release branch with the next versions written:
            # the steps above read the release commit's packages, and GitHub Packages publishes them
            # from this tree. A failed release step above still leaves the pull request to refresh.
            - name: 🤝 Create or Update Release Pull Request
              id: version_pr
              if: ${{ !cancelled() && steps.tip.outputs.current == 'true' }}
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  # No publish script, so the action publishes nothing, even if it reads no
                  # changesets where the check above found one.
                  version-script: pnpm run version
                  push-with-git-cli: true
                  commit-message: |
                      chore(changeset): release packages

                      Congratulations on the new release! 🎉
                      This is an automated commit triggered by the `release` workflow.
                  pr-title: 🚀 Release packages
                  github-token: ${{ secrets.MACHINE_USER }}

            # changesets/action writes every package's changelog into the body, which runs past
            # GitHub's size limit and then shows only headings. The body above leads with the
            # breaking changes and gives every other change one line.
            - name: 📝 Replace the release pull request's body
              if: ${{ !cancelled() && steps.version_pr.outputs.pr-number != '' }}
              env:
                  GH_TOKEN: ${{ secrets.MACHINE_USER }}
                  PR: ${{ steps.version_pr.outputs.pr-number }}
              run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/release-pr-body.md"

    executables:
        name: 🗃️ Build standalone executables
        needs: release
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || (needs.release.result == 'success' && needs.release.outputs.published == 'true')) }}
        permissions:
            contents: read
        uses: ./.github/workflows/executables.yml
        secrets: inherit
        with:
            build-type: release
            version: ${{ inputs.recover-version || needs.release.outputs.shared_version }}
            # A recovery builds the release's own source with the build scripts of the ref it was
            # started from, since the scripts of the tag are the ones that failed.
            ref: ${{ github.event_name == 'workflow_dispatch' && format('@jsprismarine/server@{0}', inputs.recover-version) || github.sha }}
            recovery: ${{ github.event_name == 'workflow_dispatch' }}
            # scripts/recover-release.mjs reads the targets from this list.
            targets: >-
                [
                    "bun-linux-x64",
                    "bun-linux-arm64",
                    "bun-linux-x64-musl",
                    "bun-linux-arm64-musl",
                    "bun-darwin-arm64",
                    "bun-windows-x64"
                ]

    aot-release:
        name: 📦 Publish standalone executables
        needs: [release, executables]
        if: ${{ always() && needs.executables.result == 'success' }}
        runs-on: ubuntu-latest
        # One publication at a time across every ref: a recovery started from another branch must
        # not read the releases before a release from master lands and then mark Latest after it.
        concurrency:
            group: release-publish-executables
            cancel-in-progress: false
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.MACHINE_USER }}
            RELEASE_VERSION: ${{ inputs.recover-version || needs.release.outputs.shared_version }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  # No old file contents, which are nearly all of the repository's 2 GB.
                  # Git fetches a blob a command needs on demand.
                  filter: blob:none

            - name: 📥 Download executable artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: dist
                  merge-multiple: true

            - name: 📝 Generate release highlights
              run: node .github/scripts/generate-release-highlights.mjs > dist/highlights.md

            # Latest is what the repository's Releases link opens, so it has to be the newest stable
            # executables release. Nightlies are prereleases, which GitHub never marks Latest, and a
            # recovery of an older version leaves Latest where it is.
            - name: 🚚 Publish standalone release
              run: |
                  tag="jsprismarine@${RELEASE_VERSION}"
                  title="JSPrismarine ${RELEASE_VERSION}"
                  # A failed request stops the step here. Read together with the version below, its
                  # failure would leave this version alone in the list, and mark it Latest.
                  # Every page: several nightlies a day would push older stable releases past one.
                  stable="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                      --jq '.[] | select(.prerelease == false and .draft == false and (.tag_name | startswith("jsprismarine@"))) | .tag_name | ltrimstr("jsprismarine@")')"
                  newest="$(printf '%s\n%s\n' "$stable" "$RELEASE_VERSION" | sort -V | tail -n 1)"
                  latest=false
                  if [ "$newest" = "$RELEASE_VERSION" ]; then latest=true; fi
                  echo "Newest stable release: $newest. Mark $tag as Latest: $latest."
                  # A recovery tags the commit the version was published from, not the branch it ran on.
                  target="$GITHUB_SHA"
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      target="$(git rev-list -n 1 "@jsprismarine/server@${RELEASE_VERSION}")"
                  fi
                  if gh release view "$tag" >/dev/null 2>&1; then
                      # Keep the published notes when recovering assets or rerunning this job.
                      gh release edit "$tag" --title "$title" --latest="$latest"
                      gh release upload "$tag" dist/prismarine-* dist/JSPrismarine-*.app.zip dist/highlights.md --clobber
                  else
                      gh release create "$tag" \
                          dist/prismarine-* \
                          dist/JSPrismarine-*.app.zip \
                          dist/highlights.md \
                          --target "$target" \
                          --title "$title" \
                          --latest="$latest" \
                          --notes-file dist/highlights.md
                  fi

            # The feed script loads TypeScript from the server package, which needs the Node the
            # repository pins rather than the runner's.
            - name: 🟢 Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc

            # Servers on the release channel read this file. It never moves back a version, so a
            # recovery of an older release leaves it alone.
            - name: 📡 Publish the release update feed
              env:
                  UPDATE_FEED_SIGNING_KEY: ${{ secrets.UPDATE_FEED_SIGNING_KEY }}
              run: |
                  commit="$GITHUB_SHA"
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      commit="$(git rev-list -n 1 "@jsprismarine/server@${RELEASE_VERSION}")"
                  fi
                  node scripts/write-update-feed.mts --channel release --version "$RELEASE_VERSION" --commit "$commit" --dist dist
