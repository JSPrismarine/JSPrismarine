name: Release

on:
    push:
        branches:
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

env:
    NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    # setup-node writes an .npmrc that reads its token from NODE_AUTH_TOKEN, so the
    # unstable publish step authenticates through it directly instead of relying
    # on the .npmrc changesets/action happens to leave behind.
    NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    NPM_CONFIG_PROVENANCE: true
    GITHUB_TOKEN: ${{ secrets.MACHINE_USER }}
    HUSKY: 0

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write

jobs:
    release:
        name: 🚚 Release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  submodules: 'recursive'
                  # Persist the machine-user PAT (not the default GITHUB_TOKEN) so the
                  # version branch pushed by changesets/action is attributed to a real
                  # user. Pushes made by github-actions[bot] do NOT trigger downstream
                  # workflows, which is why CI never ran on the autogenerated release PR.
                  token: ${{ secrets.MACHINE_USER }}

            - name: 🧬 Update submodules
              run: git submodule update --init --recursive

            - name: 📦 Install
              uses: ./.github/common/install

            - name: 🔨 Build
              run: pnpm run build

            - name: 🤝 Create Release Pull Request or Publish to NPM
              id: changesets
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  # GitHub rejects release bodies longer than 125,000 characters.
                  # Create bounded releases in the next step instead.
                  create-github-releases: false
                  push-git-tags: true
                  version-script: pnpm run version
                  publish-script: pnpm run release
                  push-with-git-cli: true
                  commit-message: |
                      chore(changeset): release packages

                      Congratulations on the new release! 🎉
                      This is an automated commit triggered by the `release` workflow.
                  pr-title: 🚀 Release packages
                  github-token: ${{ secrets.MACHINE_USER }}

            - name: 📝 Create GitHub Releases
              if: steps.changesets.outputs.published == 'true'
              env:
                  PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
              run: node .github/scripts/create-github-releases.mjs

            - name: 🫨 Create Unstable Release
              if: steps.changesets.outputs.published != 'true'
              run: |
                  git checkout master
                  pnpm run version:unstable
                  pnpm run release:unstable
