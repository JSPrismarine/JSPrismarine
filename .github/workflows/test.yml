name: Unit & Integration Tests
on:
    # PRs test branch commits; pushes test the merged result on master.
    push:
        branches:
            - master
    pull_request:

env:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master
    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

# A newer pull request push supersedes the old run. A push to master always finishes: its caches
# are the ones pull requests restore, and its Codecov upload is the base they compare against.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # A change that touches no package code or dependencies (docs, the docs site, other workflows)
    # skips every job below, and a skipped job passes branch rules. A push to master also skips
    # typecheck when the merged pull request already passed it on the same tree. The Vitest jobs
    # never reuse a pull request's result: a pull request runs only the suites its diff reaches,
    # so master runs them all.
    changes:
        name: Detect code changes
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            pull-requests: read
        outputs:
            code: ${{ steps.filter.outputs.code }}
            passed: ${{ steps.reuse.outputs.passed || '[]' }}
        steps:
            # Pull requests list their files through the API; a push diffs against the previous commit.
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # A failed lookup reuses nothing, so every job runs.
            - name: Find the jobs the merged pull request passed
              id: reuse
              if: ${{ github.event_name == 'push' }}
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: node .github/scripts/pr-job-results.mjs

            - name: Filter changed paths
              id: filter
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              with:
                  filters: |
                      code:
                          - '.github/workflows/test.yml'
                          - '.github/common/**'
                          - '.github/scripts/pr-job-results.mjs'
                          - '.test/**'
                          - 'packages/**'
                          - 'tools/client-e2e/**'
                          - 'scripts/**'
                          - 'package.json'
                          - 'pnpm-lock.yaml'
                          - 'pnpm-workspace.yaml'
                          - '.npmrc'
                          - '.nvmrc'
                          - 'tsconfig*.json'
                          - 'turbo.json'
                          - 'vite.config.ts'
                          - 'vitest.config.ts'
                          # The parity conformance suites check these pages against the code.
                          - 'docs/data-driven/parity.md'
                          - 'docs/plans/data-driven-vanilla.md'
                          - 'docs/research/edition-behavior-differences.md'

    # How many shards each Vitest suite gets. A pull request runs only the files its diff reaches,
    # usually a few dozen, and every shard pays for a checkout and an install before its first
    # test. This counts the files each suite selects and gives it a shard per 300 unit files or per
    # 15 real-data files, whose suites boot servers and generate worlds, up to four. A push to master
    # runs every file in four shards without counting.
    plan:
        name: Size the test shards
        needs: changes
        if: ${{ needs.changes.outputs.code == 'true' }}
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        outputs:
            unit: ${{ steps.size.outputs.unit || '[1,2,3,4]' }}
            real_data: ${{ steps.size.outputs.real_data || '[1,2,3,4]' }}
        steps:
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              if: ${{ github.event_name == 'pull_request' }}
              with:
                  fetch-depth: 0

            - name: 📦 Install
              if: ${{ github.event_name == 'pull_request' }}
              uses: ./.github/common/install

            # `--filesOnly` reads no test file, so it ignores the tag filters and counts every file
            # `--changed` selects. That over-counts each suite by the other's files, which can only
            # add a shard. A failure leaves the outputs empty, and both suites get four shards.
            - name: Count the files each suite runs
              id: size
              if: ${{ github.event_name == 'pull_request' }}
              continue-on-error: true
              env:
                  BASE: ${{ github.event.pull_request.base.sha }}
              run: |
                  # shards <files> <files per shard> <suite>
                  shards() {
                      local total=$(( ($1 + $2 - 1) / $2 ))
                      total=$(( total < 1 ? 1 : total > 4 ? 4 : total ))
                      echo "$3: $1 files, $total shards" >&2
                      jq -cn --argjson total "$total" '[range(1; $total + 1)]'
                  }
                  pnpm exec vitest list --filesOnly --changed="$BASE" > "$RUNNER_TEMP/unit.txt"
                  mapfile -t files < <(git grep -l "'real-data'" -- ':(glob)**/*.test.*' ':(glob)**/*.spec.*')
                  pnpm exec vitest list --filesOnly --changed="$BASE" "${files[@]}" > "$RUNNER_TEMP/real-data.txt"
                  unit=$(wc -l < "$RUNNER_TEMP/unit.txt")
                  real_data=$(wc -l < "$RUNNER_TEMP/real-data.txt")
                  echo "unit=$(shards "$unit" 300 unit)" >> "$GITHUB_OUTPUT"
                  echo "real_data=$(shards "$real_data" 15 real-data)" >> "$GITHUB_OUTPUT"

    # The unit suite runs in up to four shards, each on its own runner with a share of the test files.
    # Each shard writes a blob report holding its results and its coverage, and `tests` merges
    # them. Every file used to report in about seven minutes on one runner, and a Vitest that
    # stopped there held the runner for two hours, so a shard now fails after 15 minutes.
    tests-shard:
        name: 🧪 Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        needs: [changes, plan]
        if: ${{ needs.changes.outputs.code == 'true' }}
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                shard: ${{ fromJSON(needs.plan.outputs.unit) }}
        steps:
            # `--changed` diffs against the merge base, so the history has to reach it.
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: 📦 Install
              uses: ./.github/common/install

            # The pinned Java server jar both Vitest jobs read, keyed on the file that pins it, so the
            # unit shards and the real-data job share one download instead of each fetching their own.
            - name: Cache the Java server jar
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine/java-server
                  key: ${{ runner.os }}-jsp-java-server-${{ hashFiles('packages/bedrock-data/sources.json') }}

            # Vitest's transformed modules, one cache per shard: a shard restores and saves only what
            # its own quarter of the files loads, instead of every module any test ever loaded. An
            # entry is keyed on the file's content, so a restored one is only used while it matches.
            - name: Cache Vitest module transforms
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/vitest
                  key: ${{ runner.os }}-vitest-shard-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml', 'vitest.config.ts', 'packages/**/vitest.config.ts') }}-${{ hashFiles('packages/**/*.ts', 'packages/**/*.json') }}
                  restore-keys: |
                      ${{ runner.os }}-vitest-shard-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml', 'vitest.config.ts', 'packages/**/vitest.config.ts') }}-

            # A pull request runs the suites its diff reaches; master runs every suite.
            - name: 🧪 Test
              env:
                  CHANGED: ${{ github.event_name == 'pull_request' && format('--changed={0}', github.event.pull_request.base.sha) || '' }}
                  # Prints failures here and writes the blob report; see `reporters` in `vitest.config.ts`.
                  VITEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
              # The jar check is folded away, so the step opens on what Vitest reports.
              run: |
                  echo "::group::Java server jar"
                  pnpm --filter @jsprismarine/bedrock-data run ensure:java-server
                  echo "::endgroup::"
                  pnpm exec vitest run --coverage --tagsFilter='!real-data && !performance' $CHANGED --shard=${{ matrix.shard }}/${{ strategy.job-total }}

            - name: 📤 Keep the shard report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: vitest-blob-${{ matrix.shard }}
                  path: .vitest
                  include-hidden-files: true
                  retention-days: 1

    # The one unit result branch rules require: the shards merged into one set of results, one
    # JUnit file and one coverage report, which go to GitHub and Codecov as before.
    tests:
        name: 🧪 Tests (ubuntu-latest)
        needs: [changes, tests-shard]
        if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            # The coverage comment.
            pull-requests: write
        steps:
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 📦 Install
              uses: ./.github/common/install
              with:
                  # Merging the reports runs Vitest alone, a root dependency, and no test.
                  root-only: true

            - name: ⬇️ Collect the shard reports
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: vitest-blob-*
                  path: .vitest
                  merge-multiple: true

            # Fails when a test failed in any shard, and the next step fails when a shard did not
            # finish at all, which leaves no report to merge.
            - name: 🧪 Merge the shard reports
              run: pnpm exec vitest run --merge-reports --coverage

            - name: 🔎 Check every shard finished
              if: ${{ !cancelled() && needs.tests-shard.result != 'success' }}
              run: |
                  echo "A unit test shard ended with ${{ needs.tests-shard.result }}."
                  exit 1

            - name: 🦺 Report Coverage to GitHub
              if: ${{ !cancelled() }}
              uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2

            # Named files only: a search also picked up the JSON summaries. Codecov merges this
            # with the real-data and client e2e uploads of the same commit by flag. A pull request
            # covers only the suites it ran, so it uploads under `unit-changed` and Codecov carries
            # the base's full `unit` report forward beside it; see `codecov.yml`.
            - name: 🦺 Codecov Coverage Reports
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: JSPrismarine/JSPrismarine
                  files: coverage/lcov.info
                  disable_search: true
                  flags: ${{ github.event_name == 'pull_request' && 'unit-changed' || 'unit' }}

            - name: 🦺 Upload test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: JSPrismarine/JSPrismarine
                  report_type: test_results
                  files: junit.xml
                  disable_search: true
                  flags: ${{ github.event_name == 'pull_request' && 'unit-changed' || 'unit' }}

    # The generation host is a forked process with a lowered operating system priority, and
    # forking, priorities and signals differ by platform. Linux runs these in the job above.
    generation-host:
        name: 🧵 Generation host (${{ matrix.os }})
        needs: changes
        if: ${{ needs.changes.outputs.code == 'true' }}
        strategy:
            fail-fast: false
            matrix:
                # os: [blacksmith-2vcpu-windows-2025, blacksmith-6vcpu-macos-latest]
                os: [windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: 📦 Install
              uses: ./.github/common/install

            - name: 🧪 Test
              shell: bash
              env:
                  CHANGED: ${{ github.event_name == 'pull_request' && format('--changed={0}', github.event.pull_request.base.sha) || '' }}
              run: pnpm --filter @jsprismarine/chunkgen exec vitest run src/HostedGenerationPool.test.ts src/hostLifetime.test.ts src/ConcurrencyGovernor.test.ts $CHANGED

    typecheck:
        name: 📃 Typecheck (ubuntu-latest)
        needs: changes
        if: ${{ needs.changes.outputs.code == 'true' && !contains(fromJSON(needs.changes.outputs.passed), '📃 Typecheck (ubuntu-latest)') }}
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        steps:
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 📦 Install
              uses: ./.github/common/install

            - name: 📃 Typecheck
              run: pnpm run typecheck

    # Suites that read Mojang's published data carry the `real-data` tag. The unit test job
    # filters them out because it does not fetch sources; the jobs below prepare and run them.
    # Machine-sensitive load and timing tests carry `performance` and are excluded from CI.
    # They are Linux only because the sources are 1.1 GB unpacked and one download is enough.
    #
    # `real-data-setup` fetches the sources and runs the Java generators once, and saves the whole
    # data cache under a key made of everything that produces it. The shards and the parity
    # dashboard restore that one entry rather than each preparing it again, and a later run with
    # the same inputs finds it and prepares nothing.
    real-data-setup:
        name: 🗃️ Prepare the real data
        needs: changes
        if: ${{ needs.changes.outputs.code == 'true' }}
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            key: ${{ steps.key.outputs.key }}
        steps:
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # The Java goldens are in the key: `dump:java` checks them against the jar, so a change
            # to them has to run it again.
            - name: Resolve the cache key
              id: key
              run: echo "key=${RUNNER_OS}-jsp-real-data-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/pack-hashes.json', 'packages/bedrock-data/utils/fetch/**', 'packages/bedrock-data/utils/java/**', 'packages/bedrock-data/utils/java-dump/**', 'packages/bedrock-data/src/jsp/java/**') }}" >> "$GITHUB_OUTPUT"

            - name: Look for the prepared data
              id: prepared
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine
                  key: ${{ steps.key.outputs.key }}
                  lookup-only: true

            - name: 📦 Install
              if: ${{ steps.prepared.outputs.cache-hit != 'true' }}
              uses: ./.github/common/install

            # The Java data generator and the property dumper need a JDK of the jar's class file
            # version. `sources.json` pins Java 26.3, whose `version.json` asks for 25.
            - name: ☕ Setup JDK
              if: ${{ steps.prepared.outputs.cache-hit != 'true' }}
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
              with:
                  distribution: temurin
                  java-version: '25'

            # The pinned Java server jar the unit shards also read, keyed on the file that pins it.
            - name: Cache the Java server jar
              if: ${{ steps.prepared.outputs.cache-hit != 'true' }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine/java-server
                  key: ${{ runner.os }}-jsp-java-server-${{ hashFiles('packages/bedrock-data/sources.json') }}

            # A pin change misses the prepared entry; these restore what still matches, so only the
            # changed source downloads again.
            - name: Cache the fetched sources
              if: ${{ steps.prepared.outputs.cache-hit != 'true' }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine
                  key: ${{ runner.os }}-jsp-sources-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/pack-hashes.json') }}
                  restore-keys: |
                      ${{ runner.os }}-jsp-sources-

            # These outputs are derived from the pinned Java source jar and the repository's
            # generator. Restore them before extraction and datagen:java on repeat runs.
            - name: Cache generated Java data
              id: java_data_cache
              if: ${{ steps.prepared.outputs.cache-hit != 'true' }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      node_modules/.cache/jsprismarine/java
                      node_modules/.cache/jsprismarine/java-reports
                      node_modules/.cache/jsprismarine/java-structures
                      node_modules/.cache/jsprismarine/vanilla-datapack
                  key: ${{ runner.os }}-jsp-java-data-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/utils/java/**', 'packages/bedrock-data/utils/java-dump/**') }}

            # The fetched-source cache predates the separate generated-data key. On a miss,
            # discard its old generated outputs so datagen cannot mistake them for this key.
            - name: Discard uncached Java data
              if: ${{ steps.prepared.outputs.cache-hit != 'true' && steps.java_data_cache.outputs.cache-hit != 'true' }}
              run: |
                  rm -rf node_modules/.cache/jsprismarine/java-reports
                  rm -rf node_modules/.cache/jsprismarine/java-structures
                  rm -rf node_modules/.cache/jsprismarine/vanilla-datapack
                  rm -rf node_modules/.cache/jsprismarine/java/*/dump-classes
                  rm -rf node_modules/.cache/jsprismarine/java/*/dump-out

            - name: ⬇️ Fetch the pinned sources
              if: ${{ steps.prepared.outputs.cache-hit != 'true' }}
              run: pnpm --filter @jsprismarine/bedrock-data run fetch:sources

            - name: 🏭 Run the Java data generator
              if: ${{ steps.prepared.outputs.cache-hit != 'true' }}
              run: pnpm --filter @jsprismarine/bedrock-data run datagen:java

            # Unpacks the bundler's inner jar, which the worldgen vectors read their registries
            # out of, and rewrites the two Java goldens from the jar.
            - name: 🏭 Run the Java property dumper
              if: ${{ steps.prepared.outputs.cache-hit != 'true' }}
              run: pnpm --filter @jsprismarine/bedrock-data run dump:java

            - name: 🔎 Check the Java goldens still match the jar
              if: ${{ steps.prepared.outputs.cache-hit != 'true' }}
              run: git diff --exit-code -- packages/bedrock-data/src/jsp/java

            # Fails when a path is missing rather than saving a cache a suite would skip itself on.
            - name: 🔑 Check the real-data environment
              if: ${{ steps.prepared.outputs.cache-hit != 'true' }}
              run: node scripts/real-data-env.mts

            - name: Save the prepared data
              if: ${{ steps.prepared.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine
                  key: ${{ steps.key.outputs.key }}

    # Four shards, each with a quarter of the files that declare a `real-data` test, laid out like
    # the unit shards: the same progress lines, failures printed in place, a blob report that
    # `real-data` merges.
    real-data-shard:
        name: 🗃️ Real data (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        needs: [changes, plan, real-data-setup]
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                shard: ${{ fromJSON(needs.plan.outputs.real_data) }}
        steps:
            # `--changed` diffs against the merge base, so the history has to reach it.
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: 📦 Install
              uses: ./.github/common/install

            - name: ☕ Setup JDK
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
              with:
                  distribution: temurin
                  java-version: '25'

            - name: Restore the prepared data
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine
                  key: ${{ needs.real-data-setup.outputs.key }}
                  fail-on-cache-miss: true

            # Fails when a path is missing rather than letting a suite skip itself silently,
            # which is how these suites went unrun for as long as they did.
            - name: 🔑 Resolve the real-data environment
              run: node scripts/real-data-env.mts --github-env

            # Only the files that declare a `real-data` test are handed to Vitest, rather than every
            # test file for it to import and then skip. A tag is set in the test file's own options,
            # so the files that name it are every file that can have one.
            - name: 🧪 Test
              env:
                  CHANGED: ${{ github.event_name == 'pull_request' && format('--changed={0}', github.event.pull_request.base.sha) || '' }}
                  # Prints failures here and writes the blob report; see `reporters` in `vitest.config.ts`.
                  VITEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
              run: |
                  mapfile -t files < <(git grep -l "'real-data'" -- ':(glob)**/*.test.*' ':(glob)**/*.spec.*')
                  echo "${#files[@]} files declare a real-data test"
                  pnpm exec vitest run --coverage --tagsFilter='real-data && !performance' $CHANGED --shard=${{ matrix.shard }}/${{ strategy.job-total }} "${files[@]}"

            - name: 📤 Keep the shard report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: vitest-real-data-blob-${{ matrix.shard }}
                  path: .vitest
                  include-hidden-files: true
                  retention-days: 1

    # The one real-data result branch rules see: the shards merged into one set of results, one
    # JUnit file and one coverage report, uploaded to Codecov as the unit ones are.
    real-data:
        name: 🗃️ Real data suites
        needs: [changes, real-data-setup, real-data-shard]
        if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 📦 Install
              uses: ./.github/common/install
              with:
                  # Merging the reports runs Vitest alone, a root dependency, and no test.
                  root-only: true

            - name: ⬇️ Collect the shard reports
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: vitest-real-data-blob-*
                  path: .vitest
                  merge-multiple: true

            - name: 🧪 Merge the shard reports
              run: pnpm exec vitest run --merge-reports --coverage

            - name: 🔎 Check every shard finished
              if: ${{ !cancelled() && (needs.real-data-setup.result != 'success' || needs.real-data-shard.result != 'success') }}
              run: |
                  echo "The real data was ${{ needs.real-data-setup.result }} and the shards ended with ${{ needs.real-data-shard.result }}."
                  exit 1

            - name: 🦺 Codecov Coverage Reports
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: JSPrismarine/JSPrismarine
                  files: coverage/lcov.info
                  disable_search: true
                  flags: ${{ github.event_name == 'pull_request' && 'real-data-changed' || 'real-data' }}

            - name: 🦺 Upload test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: JSPrismarine/JSPrismarine
                  report_type: test_results
                  files: junit.xml
                  disable_search: true
                  flags: ${{ github.event_name == 'pull_request' && 'real-data-changed' || 'real-data' }}

    # The dashboard runs the whole parity package, the untagged suites as well as the real-data
    # ones, because its report has to name every family's tests. It runs beside the shards rather
    # than after them, on the same prepared data.
    parity-dashboard:
        name: 📊 Parity dashboard
        needs: [changes, real-data-setup]
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            pull-requests: write
        steps:
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 📦 Install
              uses: ./.github/common/install

            - name: ☕ Setup JDK
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
              with:
                  distribution: temurin
                  java-version: '25'

            - name: Restore the prepared data
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine
                  key: ${{ needs.real-data-setup.outputs.key }}
                  fail-on-cache-miss: true

            - name: 🔑 Resolve the real-data environment
              id: real_data_env
              run: node scripts/real-data-env.mts --github-env

            - name: 📊 Publish the parity dashboard
              id: parity_dashboard
              run: pnpm --filter @jsprismarine/parity run dashboard
            - name: Check out the pull request base
              id: parity_base_checkout
              if: ${{ !cancelled() && steps.parity_dashboard.outcome == 'success' && steps.real_data_env.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
              # uses: useblacksmith/checkout@v1
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: parity-baseline

            - name: 📦 Install pull request base dependencies
              id: parity_base_install
              if: ${{ !cancelled() && steps.parity_base_checkout.outcome == 'success' }}
              working-directory: parity-baseline
              run: pnpm install --frozen-lockfile

            - name: Share fetched data with the pull request base
              id: parity_base_cache
              if: ${{ !cancelled() && steps.parity_base_install.outcome == 'success' }}
              working-directory: parity-baseline
              run: |
                  mkdir -p node_modules/.cache
                  if [ -e node_modules/.cache/jsprismarine ] || [ -L node_modules/.cache/jsprismarine ]; then
                    rm -rf node_modules/.cache/jsprismarine
                  fi
                  ln -s "$GITHUB_WORKSPACE/node_modules/.cache/jsprismarine" node_modules/.cache/jsprismarine

            - name: ⬇️ Fetch sources for the pull request base
              id: parity_base_sources
              if: ${{ !cancelled() && steps.parity_base_cache.outcome == 'success' }}
              working-directory: parity-baseline
              run: pnpm --filter @jsprismarine/bedrock-data run fetch:sources

            - name: 🏭 Prepare Java data for the pull request base
              id: parity_base_data
              if: ${{ !cancelled() && steps.parity_base_sources.outcome == 'success' }}
              working-directory: parity-baseline
              run: |
                  pnpm --filter @jsprismarine/bedrock-data run datagen:java
                  pnpm --filter @jsprismarine/bedrock-data run dump:java
                  git diff --exit-code -- packages/bedrock-data/src/jsp/java
                  node scripts/real-data-env.mts --github-env

            - name: 🔨 Build the pull request base
              id: parity_base_build
              if: ${{ !cancelled() && steps.parity_base_data.outcome == 'success' }}
              working-directory: parity-baseline
              run: pnpm run build

            - name: 📊 Generate the pull request base dashboard
              id: parity_baseline
              if: ${{ !cancelled() && steps.parity_base_build.outcome == 'success' }}
              working-directory: parity-baseline
              env:
                  GITHUB_STEP_SUMMARY: ''
              run: pnpm --filter @jsprismarine/parity run dashboard

            - name: Save the pull request base parity report
              if: ${{ !cancelled() && steps.parity_baseline.outcome == 'success' }}
              working-directory: parity-baseline
              run: |
                  if [ -f packages/parity/dist/tracker.json ]; then
                    cp packages/parity/dist/tracker.json "$RUNNER_TEMP/parity-base-report"
                  else
                    cp packages/parity/dist/dashboard.md "$RUNNER_TEMP/parity-base-report"
                  fi

            - name: 💬 Comment on parity changes
              if: ${{ !cancelled() && steps.parity_dashboard.outcome == 'success' && steps.parity_baseline.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PARITY_BASELINE_REPORT_PATH: ${{ runner.temp }}/parity-base-report
              run: pnpm --filter @jsprismarine/parity run comment:pr
