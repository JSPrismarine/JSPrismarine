name: Unit & Integration Tests
on:
    # PRs test branch commits; pushes test the merged result on master.
    push:
        branches:
            - master
    pull_request:

env:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master
    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

jobs:
    # A change that touches no package code or dependencies (docs, the docs site, other workflows)
    # skips every job below, and a skipped job passes branch rules. A push to master also skips
    # typecheck when the merged pull request already passed it on the same tree. The Vitest jobs
    # never reuse a pull request's result: a pull request runs only the suites its diff reaches,
    # so master runs them all.
    changes:
        name: Detect code changes
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions:
            actions: read
            contents: read
            pull-requests: read
        outputs:
            code: ${{ steps.filter.outputs.code }}
            passed: ${{ steps.reuse.outputs.passed || '[]' }}
        steps:
            # Pull requests list their files through the API; a push diffs against the previous commit.
            - uses: useblacksmith/checkout@v1

            # A failed lookup reuses nothing, so every job runs.
            - name: Find the jobs the merged pull request passed
              id: reuse
              if: ${{ github.event_name == 'push' }}
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: node .github/scripts/pr-job-results.mjs

            - name: Filter changed paths
              id: filter
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              with:
                  filters: |
                      code:
                          - '.github/workflows/test.yml'
                          - '.github/common/**'
                          - '.github/scripts/pr-job-results.mjs'
                          - '.test/**'
                          - 'packages/**'
                          - 'tools/client-e2e/**'
                          - 'scripts/**'
                          - 'package.json'
                          - 'pnpm-lock.yaml'
                          - 'pnpm-workspace.yaml'
                          - '.npmrc'
                          - '.nvmrc'
                          - 'tsconfig*.json'
                          - 'turbo.json'
                          - 'vite.config.ts'
                          - 'vitest.config.ts'
                          # The parity conformance suites check these pages against the code.
                          - 'docs/data-driven/parity.md'
                          - 'docs/plans/data-driven-vanilla.md'
                          - 'docs/research/edition-behavior-differences.md'

    tests:
        name: 🧪 Tests (ubuntu-latest)
        needs: changes
        if: ${{ needs.changes.outputs.code == 'true' }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        steps:
            # `--changed` diffs against the merge base, so the history has to reach it.
            - uses: useblacksmith/checkout@v1
              with:
                  fetch-depth: 0

            - name: 📦 Install
              uses: ./.github/common/install

            - name: Cache Vitest module transforms
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/vitest
                  key: ${{ runner.os }}-vitest-${{ hashFiles('pnpm-lock.yaml', 'vitest.config.ts', 'packages/**/vitest.config.ts') }}-${{ hashFiles('packages/**/*.ts', 'packages/**/*.json') }}
                  restore-keys: |
                      ${{ runner.os }}-vitest-${{ hashFiles('pnpm-lock.yaml', 'vitest.config.ts', 'packages/**/vitest.config.ts') }}-

            # A pull request runs the suites its diff reaches; master runs every suite.
            - name: 🧪 Test
              env:
                  CHANGED: ${{ github.event_name == 'pull_request' && format('--changed={0}', github.event.pull_request.base.sha) || '' }}
              run: pnpm run test --tagsFilter='!real-data && !performance' $CHANGED

            - name: 🦺 Report Coverage to GitHub
              if: ${{ !cancelled() }}
              uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2

            # Named files only: a search also picked up the JSON summaries. Codecov merges this
            # with the real-data and client e2e uploads of the same commit by flag. A pull request
            # covers only the suites it ran, so it uploads under `unit-changed` and Codecov carries
            # the base's full `unit` report forward beside it; see `codecov.yml`.
            - name: 🦺 Codecov Coverage Reports
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: JSPrismarine/JSPrismarine
                  files: coverage/lcov.info
                  disable_search: true
                  flags: ${{ github.event_name == 'pull_request' && 'unit-changed' || 'unit' }}

            - name: 🦺 Upload test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: JSPrismarine/JSPrismarine
                  report_type: test_results
                  files: junit.xml
                  disable_search: true
                  flags: ${{ github.event_name == 'pull_request' && 'unit-changed' || 'unit' }}

    # The generation host is a forked process with a lowered operating system priority, and
    # forking, priorities and signals differ by platform. Linux runs these in the job above.
    generation-host:
        name: 🧵 Generation host (${{ matrix.os }})
        needs: changes
        if: ${{ needs.changes.outputs.code == 'true' }}
        strategy:
            fail-fast: false
            matrix:
                os: [blacksmith-2vcpu-windows-2025, blacksmith-6vcpu-macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: 📦 Install
              uses: ./.github/common/install

            - name: 🧪 Test
              shell: bash
              env:
                  CHANGED: ${{ github.event_name == 'pull_request' && format('--changed={0}', github.event.pull_request.base.sha) || '' }}
              run: pnpm --filter @jsprismarine/chunkgen exec vitest run src/HostedGenerationPool.test.ts src/hostLifetime.test.ts src/ConcurrencyGovernor.test.ts $CHANGED

    typecheck:
        name: 📃 Typecheck (ubuntu-latest)
        needs: changes
        if: ${{ needs.changes.outputs.code == 'true' && !contains(fromJSON(needs.changes.outputs.passed), '📃 Typecheck (ubuntu-latest)') }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        steps:
            - uses: useblacksmith/checkout@v1

            - name: 📦 Install
              uses: ./.github/common/install

            - name: 📃 Typecheck
              run: pnpm run typecheck

    # Suites that read Mojang's published data carry the `real-data` tag. The unit test job
    # filters them out because it does not fetch sources; this job prepares and runs them.
    # Machine-sensitive load and timing tests carry `performance` and are excluded from CI.
    # It is Linux only because the sources are 1.1 GB unpacked and one download is enough.
    real-data:
        name: 🗃️ Real data suites
        needs: changes
        if: ${{ needs.changes.outputs.code == 'true' }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 90
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: useblacksmith/checkout@v1
              with:
                  fetch-depth: 0

            - name: 📦 Install
              uses: ./.github/common/install

            # The Java data generator and the property dumper need a JDK of the jar's class file
            # version. `sources.json` pins Java 26.3, whose `version.json` asks for 25.
            - name: ☕ Setup JDK
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
              with:
                  distribution: temurin
                  java-version: '25'

            - name: Cache the fetched sources
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine
                  key: ${{ runner.os }}-jsp-sources-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/pack-hashes.json') }}
                  restore-keys: |
                      ${{ runner.os }}-jsp-sources-

            # These outputs are derived from the pinned Java source jar and the repository's
            # generator. Restore them before extraction and datagen:java on repeat runs.
            - name: Cache generated Java data
              id: java_data_cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      node_modules/.cache/jsprismarine/java
                      node_modules/.cache/jsprismarine/java-reports
                      node_modules/.cache/jsprismarine/java-structures
                      node_modules/.cache/jsprismarine/vanilla-datapack
                  key: ${{ runner.os }}-jsp-java-data-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/utils/java/**', 'packages/bedrock-data/utils/java-dump/**') }}

            # The fetched-source cache predates the separate generated-data key. On a miss,
            # discard its old generated outputs so datagen cannot mistake them for this key.
            - name: Discard uncached Java data
              if: ${{ steps.java_data_cache.outputs.cache-hit != 'true' }}
              run: |
                  rm -rf node_modules/.cache/jsprismarine/java-reports
                  rm -rf node_modules/.cache/jsprismarine/java-structures
                  rm -rf node_modules/.cache/jsprismarine/vanilla-datapack
                  rm -rf node_modules/.cache/jsprismarine/java/*/dump-classes
                  rm -rf node_modules/.cache/jsprismarine/java/*/dump-out

            - name: ⬇️ Fetch the pinned sources
              run: pnpm --filter @jsprismarine/bedrock-data run fetch:sources

            - name: 🏭 Run the Java data generator
              run: pnpm --filter @jsprismarine/bedrock-data run datagen:java

            # Unpacks the bundler's inner jar, which the worldgen vectors read their registries
            # out of, and rewrites the two Java goldens from the jar.
            - name: 🏭 Run the Java property dumper
              run: pnpm --filter @jsprismarine/bedrock-data run dump:java

            - name: 🔎 Check the Java goldens still match the jar
              run: git diff --exit-code -- packages/bedrock-data/src/jsp/java

            # Fails when a path is missing rather than letting a suite skip itself silently,
            # which is how these suites went unrun for as long as they did.
            - name: 🔑 Resolve the real-data environment
              id: real_data_env
              run: node scripts/real-data-env.mts --github-env

            - name: 🧪 Test
              env:
                  CHANGED: ${{ github.event_name == 'pull_request' && format('--changed={0}', github.event.pull_request.base.sha) || '' }}
              run: pnpm exec vitest run --coverage --tagsFilter='real-data && !performance' $CHANGED

            - name: 🦺 Codecov Coverage Reports
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: JSPrismarine/JSPrismarine
                  files: coverage/lcov.info
                  disable_search: true
                  flags: ${{ github.event_name == 'pull_request' && 'real-data-changed' || 'real-data' }}

            - name: 🦺 Upload test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: JSPrismarine/JSPrismarine
                  report_type: test_results
                  files: junit.xml
                  disable_search: true
                  flags: ${{ github.event_name == 'pull_request' && 'real-data-changed' || 'real-data' }}

            - name: 📊 Publish the parity dashboard
              id: parity_dashboard
              if: ${{ !cancelled() }}
              run: pnpm --filter @jsprismarine/parity run dashboard

            - name: Check out the pull request base
              id: parity_base_checkout
              if: ${{ !cancelled() && steps.parity_dashboard.outcome == 'success' && steps.real_data_env.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
              uses: useblacksmith/checkout@v1
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: parity-baseline

            - name: 📦 Install pull request base dependencies
              id: parity_base_install
              if: ${{ !cancelled() && steps.parity_base_checkout.outcome == 'success' }}
              working-directory: parity-baseline
              run: pnpm install --frozen-lockfile

            - name: Share fetched data with the pull request base
              id: parity_base_cache
              if: ${{ !cancelled() && steps.parity_base_install.outcome == 'success' }}
              working-directory: parity-baseline
              run: |
                  mkdir -p node_modules/.cache
                  if [ -e node_modules/.cache/jsprismarine ] || [ -L node_modules/.cache/jsprismarine ]; then
                    rm -rf node_modules/.cache/jsprismarine
                  fi
                  ln -s "$GITHUB_WORKSPACE/node_modules/.cache/jsprismarine" node_modules/.cache/jsprismarine

            - name: ⬇️ Fetch sources for the pull request base
              id: parity_base_sources
              if: ${{ !cancelled() && steps.parity_base_cache.outcome == 'success' }}
              working-directory: parity-baseline
              run: pnpm --filter @jsprismarine/bedrock-data run fetch:sources

            - name: 🏭 Prepare Java data for the pull request base
              id: parity_base_data
              if: ${{ !cancelled() && steps.parity_base_sources.outcome == 'success' }}
              working-directory: parity-baseline
              run: |
                  pnpm --filter @jsprismarine/bedrock-data run datagen:java
                  pnpm --filter @jsprismarine/bedrock-data run dump:java
                  git diff --exit-code -- packages/bedrock-data/src/jsp/java
                  node scripts/real-data-env.mts --github-env

            - name: 🔨 Build the pull request base
              id: parity_base_build
              if: ${{ !cancelled() && steps.parity_base_data.outcome == 'success' }}
              working-directory: parity-baseline
              run: pnpm run build

            - name: 📊 Generate the pull request base dashboard
              id: parity_baseline
              if: ${{ !cancelled() && steps.parity_base_build.outcome == 'success' }}
              working-directory: parity-baseline
              env:
                  GITHUB_STEP_SUMMARY: ''
              run: pnpm --filter @jsprismarine/parity run dashboard

            - name: Save the pull request base parity report
              if: ${{ !cancelled() && steps.parity_baseline.outcome == 'success' }}
              working-directory: parity-baseline
              run: |
                  if [ -f packages/parity/dist/tracker.json ]; then
                    cp packages/parity/dist/tracker.json "$RUNNER_TEMP/parity-base-report"
                  else
                    cp packages/parity/dist/dashboard.md "$RUNNER_TEMP/parity-base-report"
                  fi

            - name: 💬 Comment on parity changes
              if: ${{ !cancelled() && steps.parity_dashboard.outcome == 'success' && steps.parity_baseline.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PARITY_BASELINE_REPORT_PATH: ${{ runner.temp }}/parity-base-report
              run: pnpm --filter @jsprismarine/parity run comment:pr
