name: Executable

# Runs when a file that reaches the executables changes. A push builds them to publish a nightly
# release. A pull request builds them only when it changes how they are built: the build scripts,
# the files they embed or the dependencies Bun bundles. Every other change is compiled by the next
# nightly, since the build is three jobs on three runner platforms, two of them in the small
# Windows and macOS pools, and no pull request check requires it. Run by hand on master, it
# publishes a nightly whenever it is started, without the six-hour interval; on another branch it
# only builds.
on:
    workflow_dispatch:
    push:
        branches:
            - master
        paths:
            - '.github/workflows/nightly.yml'
            - '.github/workflows/executables.yml'
            - '.github/common/**'
            - '.github/scripts/**'
            - 'packages/**'
            - 'scripts/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.npmrc'
            - '.nvmrc'
            - 'tsconfig*.json'
            - 'turbo.json'
            - 'vite.config.ts'
            - '!**/*.md'
            - '!**/*.test.ts'
    # `closed` starts a run that cancels the pull request's queued or running builds, through the
    # concurrency group below; its jobs skip, so it takes no runner.
    pull_request:
        types: [opened, synchronize, reopened, closed]
        branches:
            - master
        paths:
            - '.github/workflows/nightly.yml'
            - '.github/workflows/executables.yml'
            - '.github/common/**'
            - '.github/scripts/**'
            # The entry point and the workers build-aot.mjs embeds by path.
            - 'packages/server/src/Server.ts'
            - 'packages/chunkgen/src/singleExecutableWorker.ts'
            - 'packages/prismarine/src/world/generators/datadriven/chunkPipeline.ts'
            - 'packages/prismarine/src/world/generators/datadriven/terrainPipeline.ts'
            - 'packages/raknet/src/WorkerServerSocket.worker.ts'
            - 'packages/leveldb/src/db/TableBuilderWorker.ts'
            # A new or updated dependency is what Bun's bundler trips on.
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.npmrc'
            - '.nvmrc'

# A newer pull request push, or the pull request closing, supersedes its builds still going. A push
# and a manual run have a group of their own, so this changes nothing for them; their jobs keep the
# groups they set below.
#
# A group holds one running job and one waiting job, and a newer waiting job cancels the one that
# waited before it, even with cancel-in-progress off. So each job of a manual run takes a group of
# its own: otherwise the next push to master cancels a nightly someone asked for.
concurrency:
    group: nightly-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
    nightly-version:
        name: 🏷️ Resolve nightly version
        # The release pull request changes only versions and changelogs, and the pull requests
        # merged before it built the same code. Skipping this job skips the builds.
        if: ${{ github.head_ref != 'changeset-release/master' && github.event.action != 'closed' }}
        concurrency:
            group: >-
                nightly-version-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) ||
                github.event.pull_request.number || github.ref }}
            cancel-in-progress: false
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        outputs:
            version: ${{ steps.metadata.outputs.BUILD_VERSION }}
            # A pull request always builds; a push builds only for a release it will publish.
            build: ${{ github.event_name != 'push' || steps.release_cadence.outputs.publish == 'true' }}
        steps:
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 🕒 Read workflow start time
              id: start_time
              run: |
                  started_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at')"
                  echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

            # The release plan the pending changesets make, which names the server's next version.
            # A nightly is a prerelease of that version, not of the one already released.
            - name: 📦 Install
              uses: ./.github/common/install
              with:
                  root-only: 'true'

            # `changeset status` also lists packages changed since `master` without a changeset, and
            # fails when it cannot find where HEAD left `master`, which a pull request's shallow
            # checkout has no branch for. The plan comes from the changeset files alone, so a
            # `master` at HEAD is enough.
            - name: 🗒️ Read the release plan
              run: |
                  git rev-parse --verify -q refs/heads/master > /dev/null || git branch master HEAD
                  pnpm exec changeset status --output "$RUNNER_TEMP/release-plan.json"

            - name: 🏷️ Set nightly version
              id: metadata
              env:
                  BUILD_TYPE: nightly
                  RELEASE_PLAN: ${{ runner.temp }}/release-plan.json
                  GITHUB_RUN_STARTED_AT: ${{ steps.start_time.outputs.started_at }}
              run: node .github/scripts/set-build-metadata.mjs

            # Nightlies are published at most once every six hours. Deciding that here, before the
            # builds, keeps a push inside the interval from compiling three executables that the
            # release job would then discard.
            - name: 🕕 Check nightly release interval
              id: release_cadence
              if: ${{ github.event_name == 'push' }}
              env:
                  BUILD_VERSION: ${{ steps.metadata.outputs.BUILD_VERSION }}
              run: .github/scripts/nightly-release-due.sh

    # Skipping it skips the release.
    executables:
        name: 🚚 Build nightly executables
        needs: nightly-version
        if: ${{ needs.nightly-version.outputs.build == 'true' }}
        concurrency:
            group: >-
                nightly-build-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) ||
                github.event.pull_request.number || github.ref }}
            cancel-in-progress: false
        permissions:
            contents: read
        uses: ./.github/workflows/executables.yml
        secrets: inherit
        with:
            build-type: nightly
            version: ${{ needs.nightly-version.outputs.version }}
            targets: '["bun-linux-x64", "bun-darwin-arm64", "bun-windows-x64"]'

    nightly-release:
        name: 🌙 Publish nightly release
        needs: [nightly-version, executables]
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
        runs-on: ubuntu-latest
        concurrency:
            # A manual nightly publishes whatever the interval says, so it needs no turn after a push's.
            group: >-
                jsprismarine-nightly-release${{ github.event_name == 'workflow_dispatch' &&
                format('-dispatch-{0}', github.run_id) || '' }}
            cancel-in-progress: false
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.MACHINE_USER }}
            BUILD_TYPE: nightly
            BUILD_VERSION: ${{ needs.nightly-version.outputs.version }}
            # A nightly started by hand is wanted now, whenever the last one was published.
            NIGHTLY_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  # No old file contents, which are nearly all of the repository's 2 GB.
                  # Git fetches a blob a command needs on demand.
                  filter: blob:none

            # The build metadata and feed scripts load TypeScript from the server package, which
            # needs the Node the repository pins rather than the runner's.
            - name: 🟢 Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc

            # Checked again: another run may have published while this one was building.
            - name: 🕕 Check nightly release interval
              id: release_cadence
              run: .github/scripts/nightly-release-due.sh

            - name: 🏷️ Set build metadata
              if: ${{ steps.release_cadence.outputs.publish == 'true' }}
              run: node .github/scripts/set-build-metadata.mjs

            - name: 📥 Download executables
              if: ${{ steps.release_cadence.outputs.publish == 'true' }}
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: dist
                  merge-multiple: true

            - name: 📝 Generate release highlights
              if: ${{ steps.release_cadence.outputs.publish == 'true' }}
              run: node .github/scripts/generate-release-highlights.mjs > dist/highlights.md

            - name: 🌙 Publish nightly release
              if: ${{ steps.release_cadence.outputs.publish == 'true' }}
              run: |
                  tag="jsprismarine@${BUILD_VERSION}"
                  title="JSPrismarine ${BUILD_VERSION}"
                  if gh release view "$tag" >/dev/null 2>&1; then
                      gh release edit "$tag" --title "$title" --notes-file dist/highlights.md --prerelease
                      gh release upload "$tag" dist/prismarine-* dist/JSPrismarine-*.app.zip dist/highlights.md --clobber
                  else
                      gh release create "$tag" \
                          dist/prismarine-* \
                          dist/JSPrismarine-*.app.zip \
                          dist/highlights.md \
                          --target "$GITHUB_SHA" \
                          --title "$title" \
                          --prerelease \
                          --latest=false \
                          --notes-file dist/highlights.md
                  fi

            # Servers on the nightly channel read this file.
            - name: 📡 Publish the nightly update feed
              if: ${{ steps.release_cadence.outputs.publish == 'true' }}
              env:
                  UPDATE_FEED_SIGNING_KEY: ${{ secrets.UPDATE_FEED_SIGNING_KEY }}
              run: node scripts/write-update-feed.mts --channel nightly --version "$BUILD_VERSION" --commit "$GITHUB_SHA" --dist dist
