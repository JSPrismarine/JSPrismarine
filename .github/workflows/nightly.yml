name: Executable
on:
    push:
        branches:
            - master

env:
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
    nightly:
        name: 🚚 Build nightly executable
        strategy:
            matrix:
                os: [ubuntu, macos, windows]
        runs-on: ${{ matrix.os }}-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  submodules: 'recursive'

            - name: 📦 Install
              uses: ./.github/common/install

            - name: 🔨 Build Executable
              id: build
              continue-on-error: true
              run: pnpm run build

            # Keep installation and the lockfile on pnpm; Bun only compiles the executable.
            - name: 🐰 Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: canary

            - name: 🗃️ Compile Executable
              id: compile
              shell: bash
              run: |
                  mkdir -p dist
                  bun build ./packages/server/src/Server.ts --compile --outfile=./dist/prismarine

            - name: 🚚 Publish Artifact
              if: ${{ steps.build.outcome == 'success' && steps.compile.outcome == 'success' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: prismarine-${{ matrix.os }}
                  path: |
                      ./dist/prismarine*

