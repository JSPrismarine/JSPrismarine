name: Executable

# Runs when a file that reaches the executables changes. A push builds them to publish a nightly
# release, and a pull request builds them to check they still compile and start. Run by hand on
# master, it publishes a nightly whenever it is started, without the six-hour interval; on another
# branch it only builds.
on:
    workflow_dispatch:
    push:
        branches:
            - master
        paths:
            - '.github/workflows/nightly.yml'
            - '.github/workflows/executables.yml'
            - '.github/common/**'
            - '.github/scripts/**'
            - 'packages/**'
            - 'scripts/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.npmrc'
            - '.nvmrc'
            - 'tsconfig*.json'
            - 'turbo.json'
            - 'vite.config.ts'
            - '!**/*.md'
            - '!**/*.test.ts'
    pull_request:
        branches:
            - master
        # The same paths as the push.
        paths:
            - '.github/workflows/nightly.yml'
            - '.github/workflows/executables.yml'
            - '.github/common/**'
            - '.github/scripts/**'
            - 'packages/**'
            - 'scripts/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.npmrc'
            - '.nvmrc'
            - 'tsconfig*.json'
            - 'turbo.json'
            - 'vite.config.ts'
            - '!**/*.md'
            - '!**/*.test.ts'

env:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
    nightly-version:
        name: 🏷️ Resolve nightly version
        concurrency:
            group: nightly-version-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: false
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        outputs:
            version: ${{ steps.metadata.outputs.BUILD_VERSION }}
            # A pull request always builds; a push builds only for a release it will publish.
            build: ${{ github.event_name != 'push' || steps.release_cadence.outputs.publish == 'true' }}
        steps:
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 🕒 Read workflow start time
              id: start_time
              run: |
                  started_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at')"
                  echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

            - name: 🏷️ Set nightly version
              id: metadata
              env:
                  BUILD_TYPE: nightly
                  GITHUB_RUN_STARTED_AT: ${{ steps.start_time.outputs.started_at }}
              run: node .github/scripts/set-build-metadata.mjs

            # Nightlies are published at most once every six hours. Deciding that here, before the
            # builds, keeps a push inside the interval from compiling three executables that the
            # release job would then discard.
            - name: 🕕 Check nightly release interval
              id: release_cadence
              if: ${{ github.event_name == 'push' }}
              env:
                  BUILD_VERSION: ${{ steps.metadata.outputs.BUILD_VERSION }}
              run: .github/scripts/nightly-release-due.sh

    # Skipping it skips the release.
    executables:
        name: 🚚 Build nightly executables
        needs: nightly-version
        if: ${{ needs.nightly-version.outputs.build == 'true' }}
        concurrency:
            group: nightly-build-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: false
        permissions:
            contents: read
        uses: ./.github/workflows/executables.yml
        secrets: inherit
        with:
            build-type: nightly
            version: ${{ needs.nightly-version.outputs.version }}
            targets: '["bun-linux-x64", "bun-darwin-arm64", "bun-windows-x64"]'

    nightly-release:
        name: 🌙 Publish nightly release
        needs: [nightly-version, executables]
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
        runs-on: ubuntu-latest
        concurrency:
            group: jsprismarine-nightly-release
            cancel-in-progress: false
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.MACHINE_USER }}
            BUILD_TYPE: nightly
            BUILD_VERSION: ${{ needs.nightly-version.outputs.version }}
            # A nightly started by hand is wanted now, whenever the last one was published.
            NIGHTLY_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            # Checked again: another run may have published while this one was building.
            - name: 🕕 Check nightly release interval
              id: release_cadence
              run: .github/scripts/nightly-release-due.sh

            - name: 🏷️ Set build metadata
              if: ${{ steps.release_cadence.outputs.publish == 'true' }}
              run: node .github/scripts/set-build-metadata.mjs

            - name: 📥 Download executables
              if: ${{ steps.release_cadence.outputs.publish == 'true' }}
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: dist
                  merge-multiple: true

            - name: 📝 Generate release highlights
              if: ${{ steps.release_cadence.outputs.publish == 'true' }}
              run: node .github/scripts/generate-release-highlights.mjs > dist/highlights.md

            - name: 🌙 Publish nightly release
              if: ${{ steps.release_cadence.outputs.publish == 'true' }}
              run: |
                  tag="jsprismarine@${BUILD_VERSION}"
                  title="JSPrismarine ${BUILD_VERSION}"
                  if gh release view "$tag" >/dev/null 2>&1; then
                      gh release edit "$tag" --title "$title" --notes-file dist/highlights.md --prerelease
                      gh release upload "$tag" dist/prismarine-* dist/JSPrismarine-*.app.zip dist/highlights.md --clobber
                  else
                      gh release create "$tag" \
                          dist/prismarine-* \
                          dist/JSPrismarine-*.app.zip \
                          dist/highlights.md \
                          --target "$GITHUB_SHA" \
                          --title "$title" \
                          --prerelease \
                          --latest=false \
                          --notes-file dist/highlights.md
                  fi
