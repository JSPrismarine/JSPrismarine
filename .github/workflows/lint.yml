name: Linting
env:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master

on:
    # PRs test branch commits; pushes test the merged result on master.
    push:
        branches:
            - master
    pull_request:

jobs:
    lint:
        name: 📃 Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 📦 Install
              uses: ./.github/common/install

            - name: 📃 Lint
              run: pnpm run lint

