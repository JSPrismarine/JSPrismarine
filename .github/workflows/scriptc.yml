# Tracks whether the experimental scriptc ahead-of-time build works yet. The
# default executable comes from Node's single-executable packaging (see
# `pnpm run package`); this workflow is allowed to fail and exists so the day
# scriptc can compile the server shows up as a green run.
name: scriptc

env:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master

on:
    push:
        branches:
            - master
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    scriptc:
        name: 🧪 Attempt scriptc build
        runs-on: blacksmith-2vcpu-ubuntu-2404
        continue-on-error: true
        steps:
            - uses: useblacksmith/checkout@v1

            - name: 📦 Install
              uses: ./.github/common/install

            # The compiler's native binaries can land without their executable bit,
            # which fails with "TypeScript server startup: Permission denied".
            - name: 🔧 Restore executable bits
              run: |
                  find node_modules/.pnpm/@scriptc+cli-*/node_modules/@scriptc/cli-*/dist \
                      \( -path '*/bin/scriptc' -o -path '*/lib/tsc-ts/lib/tsc-ts' -o -path '*/lib/typescript/lib/tsc' -o -name scriptc-comptime \) \
                      -type f -exec chmod +x {} +

            - name: 🧪 Coverage report
              continue-on-error: true
              run: pnpm run package:scriptc:coverage

            - name: 🧪 Build
              continue-on-error: true
              run: pnpm run package:scriptc
