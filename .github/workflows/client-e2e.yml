name: Client E2E
# Joins a server built from this checkout with the pinned cinnabar Bedrock client (a real
# rendering client, driven headlessly over MCP) and runs the tools/client-e2e scenarios.
#
# macOS runners are the one hosted platform where the client's renderer is proven in CI
# (cinnabar's own GPU tests run on macos-latest via Metal). The client build is slow, so it runs
# once per protocol pin in cinnabar-build, only when the cache has no entry for that exact commit.
# Every client-e2e job then restores that entry, so a run only boots the server, joins, and plays.
on:
    workflow_call:
        inputs:
            scenarios:
                description: Space-separated scenario names; empty runs them all
                type: string
                required: false
                default: ''
            record:
                description: Record the latest supported protocol as an MP4 artifact
                type: boolean
                required: false
                default: false
            latest_only:
                description: Run only the latest supported protocol
                type: boolean
                required: false
                default: false
        outputs:
            latest_protocol:
                description: Latest supported Bedrock protocol
                value: ${{ jobs.protocol-matrix.outputs.latest }}
    push:
        branches:
            - master
        paths:
            - .github/workflows/client-e2e.yml
            - tools/client-e2e/**
            - packages/auth/**
            - packages/binaryutils/**
            - packages/minecraft/**
            - packages/nbt/**
            - packages/prismarine/**
            - packages/protocol/**
            - packages/raknet/**
            - packages/server/**
            - packages/wire/**
            - packages/bedrock-data/sources.json
    pull_request:
        # Keep one client-e2e run per PR and scale it down when no client runtime paths changed.
    workflow_dispatch:
        inputs:
            scenarios:
                description: Space-separated scenario names; empty runs them all
                default: ''
            record:
                description: Also record the latest supported protocol as an MP4 artifact
                type: boolean
                default: false
            latest_only:
                description: Run only the latest supported protocol
                type: boolean
                default: false

concurrency:
    group: client-e2e-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read

jobs:
    protocol-matrix:
        name: Read supported protocols
        runs-on: ubuntu-latest
        outputs:
            protocols: ${{ steps.matrix.outputs.protocols }}
            latest: ${{ steps.matrix.outputs.latest }}
            scenarios: ${{ steps.matrix.outputs.scenarios }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set matrix from BDS pins
              id: matrix
              run: |
                  # Keep the Node script single-quoted so shell interpolation cannot alter it.
                  # shellcheck disable=SC2016
                  node --input-type=module -e '
                  import fs from "node:fs";
                  const { bds } = JSON.parse(fs.readFileSync("packages/bedrock-data/sources.json", "utf8"));
                  if (typeof bds !== "object" || bds === null || typeof bds.versions !== "object" || bds.versions === null) {
                      throw new Error("packages/bedrock-data/sources.json has no bds.versions map");
                  }
                  const allProtocols = Object.keys(bds.versions).map(Number).sort((left, right) => left - right);
                  if (allProtocols.length === 0 || allProtocols.some((protocol) => !Number.isSafeInteger(protocol) || protocol <= 0)) {
                      throw new Error("BDS protocol pins must contain numeric protocol keys");
                  }
                  const latest = allProtocols.at(-1);
                  const runtimePath = (file) => [
                      ".github/workflows/client-e2e.yml",
                      "tools/client-e2e/",
                      "packages/auth/",
                      "packages/binaryutils/",
                      "packages/minecraft/",
                      "packages/nbt/",
                      "packages/prismarine/",
                      "packages/protocol/",
                      "packages/raknet/",
                      "packages/server/",
                      "packages/wire/",
                      "packages/bedrock-data/sources.json",
                  ].some((path) => path.endsWith("/") ? file.startsWith(path) : file === path);
                  let files = [];
                  if (process.env.EVENT_NAME === "pull_request") {
                      const headers = {
                          Accept: "application/vnd.github+json",
                          Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                          "X-GitHub-Api-Version": "2022-11-28",
                      };
                      for (let page = 1; ; page += 1) {
                          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}/files?per_page=100&page=${page}`;
                          const response = await fetch(url, { headers });
                          if (!response.ok) throw new Error(`Unable to read changed PR files: ${response.status} ${await response.text()}`);
                          const pageFiles = await response.json();
                          files.push(...pageFiles.map(({ filename }) => filename));
                          if (pageFiles.length < 100) break;
                      }
                  }
                  const evidenceOnly = process.env.EVENT_NAME === "pull_request" && files.length > 0 && !files.some(runtimePath);
                  const latestOnly = process.env.LATEST_ONLY === "true" || evidenceOnly;
                  const scenarios = process.env.SCENARIOS || (evidenceOnly ? "ender-dragon" : "");
                  const protocols = latestOnly ? [latest] : allProtocols;
                  console.log(`protocols=${JSON.stringify(protocols)}`);
                  console.log(`latest=${latest}`);
                  console.log(`scenarios=${scenarios}`);
                  ' >> "$GITHUB_OUTPUT"
              env:
                  LATEST_ONLY: ${{ inputs.latest_only }}
                  SCENARIOS: ${{ inputs.scenarios || '' }}
                  EVENT_NAME: ${{ github.event_name }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}

    cinnabar-build:
        name: 🔨 Build cinnabar client (protocol ${{ matrix.protocol }})
        needs: protocol-matrix
        strategy:
            fail-fast: false
            matrix:
                protocol: ${{ fromJSON(needs.protocol-matrix.outputs.protocols) }}
        runs-on: macos-latest
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # One entry per protocol and pinned commit, so bumping one pin leaves the other cached.
            - name: Resolve the cache key
              id: pin
              env:
                  PROTOCOL: ${{ matrix.protocol }}
              run: |
                  commit="$(node -p 'JSON.parse(require("node:fs").readFileSync("tools/client-e2e/cinnabar.json", "utf8")).versions[process.env.PROTOCOL].commit')"
                  echo "key=${RUNNER_OS}-cinnabar-v${PROTOCOL}-${commit}" >> "$GITHUB_OUTPUT"

            # Only look the entry up: a hit means the build is done, and the e2e job downloads it.
            - name: Look for an existing build
              id: cinnabar-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/v${{ matrix.protocol }}
                  key: ${{ steps.pin.outputs.key }}
                  lookup-only: true

            # A pin change misses the exact key but restores the previous pin's build, so cargo
            # only recompiles what differs.
            - name: Restore the previous pin's build
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/v${{ matrix.protocol }}
                  key: ${{ steps.pin.outputs.key }}
                  restore-keys: |
                      ${{ runner.os }}-cinnabar-v${{ matrix.protocol }}-

            - name: 📦 Install
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              uses: ./.github/common/install

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              with:
                  go-version: 'stable'
                  cache: false

            - name: Prepare the shared Rust compiler cache
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
              with:
                  version: v0.18.0

            - name: 🔨 Build the pinned cinnabar client
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              run: pnpm --filter @jsprismarine/client-e2e run ensure -- --protocol "$PROTOCOL"
              env:
                  JSP_CINNABAR_CACHE_DIR: ${{ runner.temp }}/jsprismarine/cinnabar
                  PROTOCOL: ${{ matrix.protocol }}
                  RUSTC_WRAPPER: sccache
                  SCCACHE_GHA_ENABLED: 'true'

            # Save on every ref. A PR's entry is only visible to that PR, which is enough for the
            # e2e jobs below; master's entries are what other PRs fall back to.
            - name: Save the build
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/v${{ matrix.protocol }}
                  key: ${{ steps.pin.outputs.key }}

    client-e2e:
        name: 🎮 Client E2E (protocol ${{ matrix.protocol }})
        needs: [protocol-matrix, cinnabar-build]
        strategy:
            fail-fast: false
            matrix:
                protocol: ${{ fromJSON(needs.protocol-matrix.outputs.protocols) }}
        runs-on: macos-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 📦 Install
              uses: ./.github/common/install

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: 'stable'
                  cache: false

            # The cloudburst data pack that `pnpm install` fetches, shared with other runs.
            # The cinnabar build uses a separate cache outside the workspace.
            - name: Cache the fetched sources
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine
                  key: ${{ runner.os }}-jsp-sources-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/pack-hashes.json') }}
                  restore-keys: |
                      ${{ runner.os }}-jsp-sources-

            - name: Resolve the cache key
              id: pin
              env:
                  PROTOCOL: ${{ matrix.protocol }}
              run: |
                  commit="$(node -p 'JSON.parse(require("node:fs").readFileSync("tools/client-e2e/cinnabar.json", "utf8")).versions[process.env.PROTOCOL].commit')"
                  echo "key=${RUNNER_OS}-cinnabar-v${PROTOCOL}-${commit}" >> "$GITHUB_OUTPUT"

            # cinnabar-build guarantees this entry exists, so a miss is a workflow bug, not a reason to compile.
            - name: Restore the cinnabar build
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/v${{ matrix.protocol }}
                  key: ${{ steps.pin.outputs.key }}
                  fail-on-cache-miss: true

            - name: 🍿 Install ffmpeg for recording
              if: ${{ (inputs.record || github.event_name == 'pull_request' || github.event_name == 'push') && matrix.protocol == needs.protocol-matrix.outputs.latest }}
              run: brew install ffmpeg

            - name: 🎮 Run the client e2e scenarios
              env:
                  # Both expand unquoted below: empty vanishes, and scenarios word-split by design.
                  # run.mts calls ensureCinnabar too; it finds the restored build and compiles nothing.
                  JSP_CINNABAR_CACHE_DIR: ${{ runner.temp }}/jsprismarine/cinnabar
                  RECORD: ${{ (inputs.record || github.event_name == 'pull_request' || github.event_name == 'push') && matrix.protocol == needs.protocol-matrix.outputs.latest && '--record' || '' }}
                  SCENARIOS: ${{ inputs.scenarios || needs.protocol-matrix.outputs.scenarios }}
                  PROTOCOL: ${{ matrix.protocol }}
              run: |
                  # shellcheck disable=SC2086
                  pnpm run e2e:client -- --artifacts "$RUNNER_TEMP/client-e2e" --protocol "$PROTOCOL" --concurrency 1 $RECORD $SCENARIOS

            - name: 🔎 Verify client e2e coverage
              id: client-e2e-coverage
              run: node scripts/check-client-e2e-coverage.mts

            - name: 🦺 Upload client e2e coverage to Codecov
              if: ${{ !cancelled() && steps.client-e2e-coverage.outcome == 'success' }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: JSPrismarine/JSPrismarine
                  files: coverage/client-e2e/lcov.info
                  flags: client-e2e-${{ matrix.protocol }}

            - name: 📤 Upload evidence
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: client-e2e-evidence-protocol-${{ matrix.protocol }}
                  path: ${{ runner.temp }}/client-e2e
                  if-no-files-found: warn

    client-e2e-compression:
        name: 🎮 Client E2E (${{ matrix.compression }} compression, protocol ${{ matrix.protocol }})
        needs: [protocol-matrix, cinnabar-build]
        strategy:
            fail-fast: false
            matrix:
                protocol: ${{ fromJSON(needs.protocol-matrix.outputs.protocols) }}
                compression: [snappy, none]
        runs-on: macos-latest
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 📦 Install
              uses: ./.github/common/install

            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: 'stable'
                  cache: false

            - name: Cache the fetched sources
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine
                  key: ${{ runner.os }}-jsp-sources-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/pack-hashes.json') }}
                  restore-keys: |
                      ${{ runner.os }}-jsp-sources-

            - name: Resolve the Cinnabar cache key
              id: pin
              env:
                  PROTOCOL: ${{ matrix.protocol }}
              run: |
                  commit="$(node -p 'JSON.parse(require("node:fs").readFileSync("tools/client-e2e/cinnabar.json", "utf8")).versions[process.env.PROTOCOL].commit')"
                  echo "key=${RUNNER_OS}-cinnabar-v${PROTOCOL}-${commit}" >> "$GITHUB_OUTPUT"

            # The primary e2e matrix builds this exact pinned client once for each protocol.
            - name: Restore the pinned Cinnabar build
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/v${{ matrix.protocol }}
                  key: ${{ steps.pin.outputs.key }}
                  fail-on-cache-miss: true

            - name: 🎮 Run client e2e with selected compression
              env:
                  COMPRESSION: ${{ matrix.compression }}
                  JSP_CINNABAR_CACHE_DIR: ${{ runner.temp }}/jsprismarine/cinnabar
                  PROTOCOL: ${{ matrix.protocol }}
              run: pnpm run e2e:client -- --artifacts "$RUNNER_TEMP/client-e2e" --protocol "$PROTOCOL" --compression-algorithm "$COMPRESSION" --concurrency 1

            - name: 📤 Upload evidence
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: client-e2e-evidence-${{ matrix.compression }}-protocol-${{ matrix.protocol }}
                  path: ${{ runner.temp }}/client-e2e
                  if-no-files-found: warn
