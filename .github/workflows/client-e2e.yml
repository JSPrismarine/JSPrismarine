name: Client E2E
# Joins a server built from this checkout with the pinned cinnabar Bedrock client (a real
# rendering client, driven headlessly over MCP) and runs the tools/client-e2e scenarios.
#
# macOS runners are the one hosted platform where the client's renderer is proven in CI
# (cinnabar's own GPU tests run on macos-latest via Metal). The client build is slow, so it runs
# once per protocol pin in cinnabar-build, only when the cache has no entry for that exact commit.
# Every client-e2e job then restores that entry, so a run only boots the server, joins, and plays.
on:
    push:
        branches:
            - master
        paths:
            - .github/workflows/client-e2e.yml
            - tools/client-e2e/**
            - packages/auth/**
            - packages/binaryutils/**
            - packages/minecraft/**
            - packages/nbt/**
            - packages/prismarine/**
            - packages/protocol/**
            - packages/raknet/**
            - packages/server/**
            - packages/wire/**
            - packages/bedrock-data/sources.json
    pull_request:
        paths:
            - .github/workflows/client-e2e.yml
            - tools/client-e2e/**
            - packages/auth/**
            - packages/binaryutils/**
            - packages/minecraft/**
            - packages/nbt/**
            - packages/prismarine/**
            - packages/protocol/**
            - packages/raknet/**
            - packages/server/**
            - packages/wire/**
            - packages/bedrock-data/sources.json
    workflow_dispatch:
        inputs:
            scenarios:
                description: Space-separated scenario names; empty runs them all
                default: ''
            latest_only:
                description: Run only the latest supported protocol
                type: boolean
                default: false

concurrency:
    group: client-e2e-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
    # A newer pull request push supersedes the old run, but a push to a branch must finish: the
    # Cinnabar build takes about an hour cold, so every master push that cancelled its
    # predecessor meant the build cache was never saved and no pull request could restore it.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    pull-requests: read

jobs:
    protocol-matrix:
        name: Read supported protocols
        runs-on: ubuntu-latest
        outputs:
            protocols: ${{ steps.matrix.outputs.protocols }}
            latest: ${{ steps.matrix.outputs.latest }}
            scenarios: ${{ steps.matrix.outputs.scenarios }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set matrix from BDS pins
              id: matrix
              run: |
                  # Keep the Node script single-quoted so shell interpolation cannot alter it.
                  # shellcheck disable=SC2016
                  node --input-type=module -e '
                  import fs from "node:fs";
                  const { bds } = JSON.parse(fs.readFileSync("packages/bedrock-data/sources.json", "utf8"));
                  if (typeof bds !== "object" || bds === null || typeof bds.versions !== "object" || bds.versions === null) {
                      throw new Error("packages/bedrock-data/sources.json has no bds.versions map");
                  }
                  const allProtocols = Object.keys(bds.versions).map(Number).sort((left, right) => left - right);
                  if (allProtocols.length === 0 || allProtocols.some((protocol) => !Number.isSafeInteger(protocol) || protocol <= 0)) {
                      throw new Error("BDS protocol pins must contain numeric protocol keys");
                  }
                  const latest = allProtocols.at(-1);
                  const latestOnly = process.env.LATEST_ONLY === "true";
                  const scenarios = process.env.SCENARIOS || "";
                  const protocols = latestOnly ? [latest] : allProtocols;
                  console.log(`protocols=${JSON.stringify(protocols)}`);
                  console.log(`latest=${latest}`);
                  console.log(`scenarios=${scenarios}`);
                  ' >> "$GITHUB_OUTPUT"
              env:
                  LATEST_ONLY: ${{ inputs.latest_only }}
                  SCENARIOS: ${{ inputs.scenarios || '' }}

    cinnabar-build:
        name: 🔨 Build cinnabar client (protocol ${{ matrix.protocol }})
        needs: protocol-matrix
        strategy:
            fail-fast: false
            matrix:
                protocol: ${{ fromJSON(needs.protocol-matrix.outputs.protocols) }}
        runs-on: macos-latest
        timeout-minutes: 120
        permissions:
            contents: read
            # Lets the last step delete the builds of pins this one replaced.
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # One entry per protocol and pinned commit, so bumping one pin leaves the other cached.
            - name: Resolve the cache key
              id: pin
              env:
                  PROTOCOL: ${{ matrix.protocol }}
              run: |
                  commit="$(node -p 'JSON.parse(require("node:fs").readFileSync("tools/client-e2e/cinnabar.json", "utf8")).versions[process.env.PROTOCOL].commit')"
                  echo "key=${RUNNER_OS}-cinnabar-v${PROTOCOL}-${commit}" >> "$GITHUB_OUTPUT"

            # Only look the entry up: a hit means the build is done, and the e2e job downloads it.
            - name: Look for an existing build
              id: cinnabar-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/v${{ matrix.protocol }}
                  key: ${{ steps.pin.outputs.key }}
                  lookup-only: true

            # A pin change misses the exact key but restores the previous pin's build, so cargo
            # only recompiles what differs.
            - name: Restore the previous pin's build
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/v${{ matrix.protocol }}
                  key: ${{ steps.pin.outputs.key }}
                  restore-keys: |
                      ${{ runner.os }}-cinnabar-v${{ matrix.protocol }}-

            - name: 📦 Install
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              uses: ./.github/common/install

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              with:
                  go-version: 'stable'
                  cache: false

            - name: Prepare the shared Rust compiler cache
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
              with:
                  version: v0.18.0

            - name: 🔨 Build the pinned cinnabar client
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              run: pnpm --filter @jsprismarine/client-e2e run ensure -- --protocol "$PROTOCOL"
              env:
                  JSP_CINNABAR_CACHE_DIR: ${{ runner.temp }}/jsprismarine/cinnabar
                  PROTOCOL: ${{ matrix.protocol }}
                  RUSTC_WRAPPER: sccache
                  SCCACHE_GHA_ENABLED: 'true'

            # Cargo's intermediate directory is about 14 GB (2.6 GB compressed) and only a compile
            # reads it: the e2e jobs need the checkout, the stamp and the three binaries under
            # `target/`, which `ensureBuilt` accepts without it. Two such entries pushed the
            # repository over its 10 GB cache limit and were evicted before any PR could restore
            # them. sccache keeps recompiles cheap after a pin change.
            - name: Drop cargo's intermediate build directory
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              run: rm -rf "${{ runner.temp }}/jsprismarine/cinnabar/v${{ matrix.protocol }}/build"

            # Save on every ref. A PR's entry is only visible to that PR, which is enough for the
            # e2e jobs below; master's entries are what other PRs fall back to.
            - name: Save the build
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/v${{ matrix.protocol }}
                  key: ${{ steps.pin.outputs.key }}

            # A bumped pin leaves its predecessor's 680 MB entry behind, and enough of those push the
            # repository over its cache limit, which evicts whichever entry was used least recently.
            # Only master prunes: a pull request that dropped them would take away what other
            # pull requests fall back to.
            - name: Delete the builds of replaced pins
              if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  KEY: ${{ steps.pin.outputs.key }}
                  PREFIX: ${{ runner.os }}-cinnabar-v${{ matrix.protocol }}-
              run: |
                  gh cache list --repo "$GITHUB_REPOSITORY" --key "$PREFIX" --limit 100 --json id,key \
                      --jq ".[] | select(.key != \"$KEY\") | .id" |
                      while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done

    client-e2e:
        name: 🎮 Client E2E (protocol ${{ matrix.protocol }})
        needs: [protocol-matrix, cinnabar-build]
        strategy:
            fail-fast: false
            matrix:
                protocol: ${{ fromJSON(needs.protocol-matrix.outputs.protocols) }}
        runs-on: macos-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 📦 Install
              uses: ./.github/common/install

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: 'stable'
                  cache: false

            # The cloudburst data pack that `pnpm install` fetches, shared with other runs.
            # The cinnabar build uses a separate cache outside the workspace.
            - name: Cache the fetched sources
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine
                  key: ${{ runner.os }}-jsp-sources-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/pack-hashes.json') }}
                  restore-keys: |
                      ${{ runner.os }}-jsp-sources-

            # The server reads the vanilla datapack (recipes, entities, loot, worldgen) from the
            # data generator's output. Without it the scenarios that need a smelting recipe, a
            # cow or a hoe's farmland run against 0 recipes and 4 entities and fail, and the
            # `worldgen-spawn` suite cannot boot.
            - name: ☕ Setup JDK
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
              with:
                  distribution: temurin
                  java-version: '25'

            - name: Cache generated Java data
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      node_modules/.cache/jsprismarine/java
                      node_modules/.cache/jsprismarine/java-reports
                      node_modules/.cache/jsprismarine/java-structures
                      node_modules/.cache/jsprismarine/vanilla-datapack
                  key: ${{ runner.os }}-jsp-java-data-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/utils/java/**', 'packages/bedrock-data/utils/java-dump/**') }}

            - name: 🏭 Prepare the Java data
              run: pnpm --filter @jsprismarine/bedrock-data run ensure:worldgen

            - name: Resolve the cache key
              id: pin
              env:
                  PROTOCOL: ${{ matrix.protocol }}
              run: |
                  commit="$(node -p 'JSON.parse(require("node:fs").readFileSync("tools/client-e2e/cinnabar.json", "utf8")).versions[process.env.PROTOCOL].commit')"
                  echo "key=${RUNNER_OS}-cinnabar-v${PROTOCOL}-${commit}" >> "$GITHUB_OUTPUT"

            # cinnabar-build guarantees this entry exists, so a miss is a workflow bug, not a reason to compile.
            - name: Restore the cinnabar build
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/v${{ matrix.protocol }}
                  key: ${{ steps.pin.outputs.key }}
                  fail-on-cache-miss: true

            - name: 🎮 Run the client e2e scenarios
              env:
                  # Expands unquoted below: empty vanishes, and scenarios word-split by design.
                  # run.mts calls ensureCinnabar too; it finds the restored build and compiles nothing.
                  JSP_CINNABAR_CACHE_DIR: ${{ runner.temp }}/jsprismarine/cinnabar
                  SCENARIOS: ${{ inputs.scenarios || needs.protocol-matrix.outputs.scenarios }}
                  PROTOCOL: ${{ matrix.protocol }}
                  NODE_OPTIONS: --max-old-space-size=4096
              run: |
                  # shellcheck disable=SC2086
                  pnpm run e2e:client -- --artifacts "$RUNNER_TEMP/client-e2e" --protocol "$PROTOCOL" --concurrency 2 $SCENARIOS

            - name: 🔎 Verify client e2e coverage
              id: client-e2e-coverage
              run: node scripts/check-client-e2e-coverage.mts

            - name: 🦺 Upload client e2e coverage to Codecov
              if: ${{ !cancelled() && steps.client-e2e-coverage.outcome == 'success' }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: JSPrismarine/JSPrismarine
                  files: coverage/client-e2e/lcov.info
                  flags: client-e2e-${{ matrix.protocol }}

            - name: 📤 Upload evidence
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: client-e2e-evidence-protocol-${{ matrix.protocol }}
                  path: ${{ runner.temp }}/client-e2e
                  if-no-files-found: warn
