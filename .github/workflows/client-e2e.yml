name: Client E2E
# Joins a server built from this checkout with the pinned cinnabar Bedrock client (a real
# rendering client, driven headlessly over MCP) and runs the tools/client-e2e scenarios.
#
# macOS runners are the one hosted platform where the client's renderer is proven in CI
# (cinnabar's own GPU tests run on macos-latest via Metal). The client build is slow once per
# cinnabar pin and then comes from the cache, so warm runs only boot the server, join, and play.
on:
    workflow_call:
        inputs:
            scenarios:
                description: Space-separated scenario names; empty runs them all
                type: string
                required: false
                default: ''
            record:
                description: Record the latest supported protocol as an MP4 artifact
                type: boolean
                required: false
                default: false
            latest_only:
                description: Run only the latest supported protocol
                type: boolean
                required: false
                default: false
        outputs:
            latest_protocol:
                description: Latest supported Bedrock protocol
                value: ${{ jobs.protocol-matrix.outputs.latest }}
    push:
        branches:
            - master
        paths:
            - .github/workflows/client-e2e.yml
            - tools/client-e2e/**
            - packages/auth/**
            - packages/binaryutils/**
            - packages/minecraft/**
            - packages/nbt/**
            - packages/prismarine/**
            - packages/protocol/**
            - packages/raknet/**
            - packages/server/**
            - packages/wire/**
            - packages/bedrock-data/sources.json
    pull_request:
        # Docs CI consumes this run's recorded artifact. Keep one client-e2e run per PR and
        # scale it down to the evidence scenario when no client runtime paths changed.
    workflow_dispatch:
        inputs:
            scenarios:
                description: Space-separated scenario names; empty runs them all
                default: ''
            record:
                description: Also record the latest supported protocol as an MP4 artifact
                type: boolean
                default: false
            latest_only:
                description: Run only the latest supported protocol
                type: boolean
                default: false

concurrency:
    group: client-e2e-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read

jobs:
    protocol-matrix:
        name: Read supported protocols
        runs-on: ubuntu-latest
        outputs:
            protocols: ${{ steps.matrix.outputs.protocols }}
            latest: ${{ steps.matrix.outputs.latest }}
            scenarios: ${{ steps.matrix.outputs.scenarios }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set matrix from BDS pins
              id: matrix
              run: |
                  # Keep the Node script single-quoted so shell interpolation cannot alter it.
                  # shellcheck disable=SC2016
                  node --input-type=module -e '
                  import fs from "node:fs";
                  const { bds } = JSON.parse(fs.readFileSync("packages/bedrock-data/sources.json", "utf8"));
                  if (typeof bds !== "object" || bds === null || typeof bds.versions !== "object" || bds.versions === null) {
                      throw new Error("packages/bedrock-data/sources.json has no bds.versions map");
                  }
                  const allProtocols = Object.keys(bds.versions).map(Number).sort((left, right) => left - right);
                  if (allProtocols.length === 0 || allProtocols.some((protocol) => !Number.isSafeInteger(protocol) || protocol <= 0)) {
                      throw new Error("BDS protocol pins must contain numeric protocol keys");
                  }
                  const latest = allProtocols.at(-1);
                  const runtimePath = (file) => [
                      ".github/workflows/client-e2e.yml",
                      "tools/client-e2e/",
                      "packages/auth/",
                      "packages/binaryutils/",
                      "packages/minecraft/",
                      "packages/nbt/",
                      "packages/prismarine/",
                      "packages/protocol/",
                      "packages/raknet/",
                      "packages/server/",
                      "packages/wire/",
                      "packages/bedrock-data/sources.json",
                  ].some((path) => path.endsWith("/") ? file.startsWith(path) : file === path);
                  let files = [];
                  if (process.env.EVENT_NAME === "pull_request") {
                      const headers = {
                          Accept: "application/vnd.github+json",
                          Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                          "X-GitHub-Api-Version": "2022-11-28",
                      };
                      for (let page = 1; ; page += 1) {
                          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}/files?per_page=100&page=${page}`;
                          const response = await fetch(url, { headers });
                          if (!response.ok) throw new Error(`Unable to read changed PR files: ${response.status} ${await response.text()}`);
                          const pageFiles = await response.json();
                          files.push(...pageFiles.map(({ filename }) => filename));
                          if (pageFiles.length < 100) break;
                      }
                  }
                  const evidenceOnly = process.env.EVENT_NAME === "pull_request" && files.length > 0 && !files.some(runtimePath);
                  const latestOnly = process.env.LATEST_ONLY === "true" || evidenceOnly;
                  const scenarios = process.env.SCENARIOS || (evidenceOnly ? "ender-dragon" : "");
                  const protocols = latestOnly ? [latest] : allProtocols;
                  console.log(`protocols=${JSON.stringify(protocols)}`);
                  console.log(`latest=${latest}`);
                  console.log(`scenarios=${scenarios}`);
                  ' >> "$GITHUB_OUTPUT"
              env:
                  LATEST_ONLY: ${{ inputs.latest_only }}
                  SCENARIOS: ${{ inputs.scenarios || '' }}
                  EVENT_NAME: ${{ github.event_name }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}

    cinnabar-prebuild:
        name: Warm shared Cinnabar compiler cache
        needs: protocol-matrix
        runs-on: macos-latest
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 📦 Install
              uses: ./.github/common/install

            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: 'stable'
                  cache: false

            - name: Restore the latest protocol build cache
              id: cinnabar-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/v${{ needs.protocol-matrix.outputs.latest }}
                  key: ${{ runner.os }}-cinnabar-v${{ needs.protocol-matrix.outputs.latest }}-${{ hashFiles('tools/client-e2e/cinnabar.json') }}
                  restore-keys: |
                      ${{ runner.os }}-cinnabar-v${{ needs.protocol-matrix.outputs.latest }}-

            - name: Prepare the shared Rust compiler cache
              uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
              with:
                  version: v0.18.0

            - name: 🔨 Build latest pinned Cinnabar client
              run: pnpm --filter @jsprismarine/client-e2e run ensure -- --protocol "$PROTOCOL"
              env:
                  JSP_CINNABAR_CACHE_DIR: ${{ runner.temp }}/jsprismarine/cinnabar
                  PROTOCOL: ${{ needs.protocol-matrix.outputs.latest }}
                  RUSTC_WRAPPER: sccache
                  SCCACHE_GHA_ENABLED: 'true'

            - name: Save the latest protocol build cache
              if: ${{ github.ref == 'refs/heads/master' && steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/v${{ needs.protocol-matrix.outputs.latest }}
                  key: ${{ runner.os }}-cinnabar-v${{ needs.protocol-matrix.outputs.latest }}-${{ hashFiles('tools/client-e2e/cinnabar.json') }}

    client-e2e:
        name: 🎮 Client E2E (protocol ${{ matrix.protocol }})
        needs: [protocol-matrix, cinnabar-prebuild]
        strategy:
            fail-fast: false
            matrix:
                protocol: ${{ fromJSON(needs.protocol-matrix.outputs.protocols) }}
        runs-on: macos-latest
        # A cold cinnabar build dominates the first run after a pin change; warm runs take minutes.
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 📦 Install
              uses: ./.github/common/install

            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: 'stable'
                  cache: false

            # The cloudburst data pack that `pnpm install` fetches, shared with other runs.
            # The cinnabar build uses a separate cache outside the workspace.
            - name: Cache the fetched sources
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine
                  key: ${{ runner.os }}-jsp-sources-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/pack-hashes.json') }}
                  restore-keys: |
                      ${{ runner.os }}-jsp-sources-

            # PRs can restore the base branch cache, but caches they create are scoped to that PR.
            # Restore on every run and save only on master so sibling PRs reuse one shared build.
            - name: Restore the cinnabar build cache
              # Separate keys let both protocol jobs save and restore one shared build per version.
              id: cinnabar-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/v${{ matrix.protocol }}
                  key: ${{ runner.os }}-cinnabar-v${{ matrix.protocol }}-${{ hashFiles('tools/client-e2e/cinnabar.json') }}
                  restore-keys: |
                      ${{ runner.os }}-cinnabar-v${{ matrix.protocol }}-

            - name: Prepare the shared Rust compiler cache
              uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
              with:
                  version: v0.18.0

            - name: 🔨 Ensure the pinned cinnabar client
              run: pnpm --filter @jsprismarine/client-e2e run ensure -- --protocol "$PROTOCOL"
              env:
                  JSP_CINNABAR_CACHE_DIR: ${{ runner.temp }}/jsprismarine/cinnabar
                  PROTOCOL: ${{ matrix.protocol }}
                  RUSTC_WRAPPER: sccache
                  SCCACHE_GHA_ENABLED: 'true'

            # Keep the reusable cache in the default branch scope. PR runs only restore it.
            - name: Save the cinnabar build cache
              if: ${{ github.ref == 'refs/heads/master' && steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/v${{ matrix.protocol }}
                  key: ${{ runner.os }}-cinnabar-v${{ matrix.protocol }}-${{ hashFiles('tools/client-e2e/cinnabar.json') }}

            - name: 🍿 Install ffmpeg for recording
              if: ${{ (inputs.record || github.event_name == 'pull_request' || github.event_name == 'push') && matrix.protocol == needs.protocol-matrix.outputs.latest }}
              run: brew install ffmpeg

            - name: 🎮 Run the client e2e scenarios
              env:
                  # Both expand unquoted below: empty vanishes, and scenarios word-split by design.
                  # run.mts calls ensureCinnabar too; reuse the matrix build from the ensure step.
                  JSP_CINNABAR_CACHE_DIR: ${{ runner.temp }}/jsprismarine/cinnabar
                  RUSTC_WRAPPER: sccache
                  SCCACHE_GHA_ENABLED: 'true'
                  RECORD: ${{ (inputs.record || github.event_name == 'pull_request' || github.event_name == 'push') && matrix.protocol == needs.protocol-matrix.outputs.latest && '--record' || '' }}
                  SCENARIOS: ${{ inputs.scenarios || needs.protocol-matrix.outputs.scenarios }}
                  PROTOCOL: ${{ matrix.protocol }}
              run: |
                  # shellcheck disable=SC2086
                  pnpm run e2e:client -- --artifacts "$RUNNER_TEMP/client-e2e" --protocol "$PROTOCOL" $RECORD $SCENARIOS

            - name: 🔎 Verify client e2e coverage
              id: client-e2e-coverage
              run: node scripts/check-client-e2e-coverage.mts

            - name: 🦺 Upload client e2e coverage to Codecov
              if: ${{ !cancelled() && steps.client-e2e-coverage.outcome == 'success' }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: JSPrismarine/JSPrismarine
                  files: coverage/client-e2e/lcov.info
                  flags: client-e2e-${{ matrix.protocol }}

            - name: 📤 Upload evidence
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: client-e2e-evidence-protocol-${{ matrix.protocol }}
                  path: ${{ runner.temp }}/client-e2e
                  if-no-files-found: warn

    build-docs:
        name: 📖 Build documentation with client evidence
        if: ${{ github.event_name == 'pull_request' }}
        needs: [protocol-matrix, client-e2e]
        runs-on: ubuntu-latest
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 📦 Install
              uses: ./.github/common/install

            - name: 📥 Download latest-protocol client evidence
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: client-e2e-evidence-protocol-${{ needs.protocol-matrix.outputs.latest }}
                  path: ${{ runner.temp }}/parity-evidence

            - name: 🎞️ Stage parity evidence for GitHub Pages
              run: |
                  mkdir -p tools/docs/site/public/parity-evidence
                  cp "$RUNNER_TEMP/parity-evidence/ender-dragon/run.mp4" tools/docs/site/public/parity-evidence/ender-dragon.mp4
                  cp "$RUNNER_TEMP/parity-evidence/ender-dragon/fountain.png" tools/docs/site/public/parity-evidence/ender-dragon.png

            - name: 📖 Build documentation
              run: pnpm run build:docs
              env:
                  PARITY_EVIDENCE_REQUIRED: 'true'
