name: Client E2E
# Joins a server built from this checkout with the pinned cinnabar Bedrock client (a real
# rendering client, driven headlessly over MCP) and runs the tools/client-e2e scenarios.
#
# Every job runs on GitHub's `ubuntu-latest`. The runner has no GPU, so the client draws through
# Mesa's software Vulkan driver (lavapipe) into a hidden window on a virtual X display (Xvfb);
# cinnabar accepts a CPU adapter when it is the only one. The client build is slow, so it runs
# once per pinned commit in cinnabar-build, only for the commits the `changes` job found no cache
# entry for. When every build is cached, no build job starts and client-e2e goes straight to the
# scenarios, restoring that entry, so a run only boots the server, joins, and plays.
#
# tools/client-e2e/cinnabar.json pins one cinnabar commit per protocol and lists the transports it
# runs over. client-e2e runs once per protocol and transport, and every run of a commit restores the
# same build. A NetherNet run plays against a server with RakNet off, since Bedrock 1.26.60 joins
# over NetherNet only.
#
# The workflow runs on every push and pull request so the `✅ Client E2E` job always reports: it is
# the one branch rules require. A change that touches no package code or dependencies (docs, the
# docs site, other workflows) skips the e2e jobs and passes it, so it can still auto-merge. So does
# a pull request that changes only files a running server never loads; see the `changes` job.
on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:
        inputs:
            scenarios:
                description: Space-separated scenario names; empty runs them all
                default: ''
            latest_only:
                description: Run only the latest supported protocol
                type: boolean
                default: false

concurrency:
    group: client-e2e-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
    # A newer pull request push supersedes the old run, but a push to a branch must finish: the
    # Cinnabar build takes about an hour cold, so every master push that cancelled its
    # predecessor meant the build cache was never saved and no pull request could restore it.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    pull-requests: read

jobs:
    # A push to master also skips the e2e jobs when the merged pull request already passed them on
    # the same tree, and `reused-coverage` uploads that run's coverage for the push instead.
    changes:
        name: Detect code changes
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        permissions:
            # Finding the merged pull request's run, and listing the cached client builds.
            actions: read
            contents: read
            pull-requests: read
        outputs:
            code: ${{ github.event_name == 'workflow_dispatch' || (steps.filter.outputs.code == 'true' && steps.select.outputs.mode != 'none') }}
            pins: ${{ steps.matrix.outputs.pins }}
            # The pins whose client has to be built first.
            build: ${{ steps.builds.outputs.build }}
            latest: ${{ steps.matrix.outputs.latest }}
            # Empty runs every scenario.
            scenarios: ${{ steps.matrix.outputs.scenarios }}
            reused: ${{ contains(fromJSON(steps.reuse.outputs.passed || '[]'), '🎮 Client E2E') }}
            run-id: ${{ steps.reuse.outputs.run-id }}
        steps:
            # Pull requests list their files through the API; a push diffs against the previous commit.
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # A failed lookup reuses nothing, so every job runs.
            - name: Find the jobs the merged pull request passed
              id: reuse
              if: ${{ github.event_name == 'push' }}
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: node .github/scripts/pr-job-results.mjs

            - name: Filter changed paths
              id: filter
              if: ${{ github.event_name != 'workflow_dispatch' }}
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              with:
                  predicate-quantifier: some-with-excludes
                  filters: |
                      code:
                          - '.github/workflows/client-e2e.yml'
                          - '.github/common/**'
                          - '.github/scripts/pr-job-results.mjs'
                          - 'tools/client-e2e/**'
                          - 'packages/**'
                          - 'scripts/check-client-e2e-coverage.mts'
                          - 'package.json'
                          - 'pnpm-lock.yaml'
                          - 'pnpm-workspace.yaml'
                          - '.npmrc'
                          - '.nvmrc'
                          - '.c8rc.json'
                          - 'tsconfig*.json'
                          - 'turbo.json'
                          - '!**/*.md'

            # select.mts and pin-matrix.mts are TypeScript, which the runner's own Node may not strip.
            - name: 🏎️ Setup Node
              if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: '.nvmrc'

            # Every scenario boots the whole server, so most changes run them all. A pull request
            # that changes only files a running server never loads (tests, benchmarks, packages
            # the server does not depend on) runs none, and one that changes only scenario files
            # runs those scenarios. A push and a manual run keep every scenario, and a failure
            # here leaves the outputs empty, which also runs them all.
            - name: Select the scenarios the pull request affects
              id: select
              if: ${{ github.event_name == 'pull_request' && steps.filter.outputs.code == 'true' }}
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  set -o pipefail
                  gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" \
                      --jq '.[] | .filename, (.previous_filename // empty)' |
                      node tools/client-e2e/src/select.mts

            # What the jobs below run: the pins, the ones whose client has no cached build, and the
            # scenarios. They are read here, not in a job of their own, which would wait for a
            # second runner before the first build or scenario could start.
            #
            # One entry per declared transport of a served protocol:
            # { protocol, transport, commit, name, build }, where `name` labels the run (v2225,
            # v2225-nethernet) and `build` is the commit's cache directory, shared by its runs.
            - name: Set matrix from the cinnabar pins
              id: matrix
              if: ${{ github.event_name == 'workflow_dispatch' || (steps.filter.outputs.code == 'true' && steps.select.outputs.mode != 'none') }}
              env:
                  LATEST_ONLY: ${{ inputs.latest_only }}
                  SCENARIOS: ${{ inputs.scenarios || steps.select.outputs.scenarios || '' }}
              run: |
                  latest=()
                  if [ "$LATEST_ONLY" = true ]; then latest=(--latest-only); fi
                  pins="$(node tools/client-e2e/src/pin-matrix.mts "${latest[@]}")"
                  echo "pins=$pins" >> "$GITHUB_OUTPUT"
                  # The build that keeps cinnabar's compiled dependencies: the newest protocol's.
                  echo "latest=$(jq -r 'max_by(.protocol).build' <<< "$pins")" >> "$GITHUB_OUTPUT"
                  echo "scenarios=$SCENARIOS" >> "$GITHUB_OUTPUT"

            # A run can restore entries saved on its own ref or on master. The key matches the one
            # cinnabar-build writes, whose `runner.os` is `Linux`.
            - name: Find the builds without a cache entry
              id: builds
              if: ${{ github.event_name == 'workflow_dispatch' || (steps.filter.outputs.code == 'true' && steps.select.outputs.mode != 'none') }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  PINS: ${{ steps.matrix.outputs.pins }}
              run: |
                  missing=()
                  while read -r name commit; do
                      key="Linux-cinnabar-build-${commit}"
                      found=false
                      for ref in "$GITHUB_REF" refs/heads/master; do
                          if gh api "repos/$GITHUB_REPOSITORY/actions/caches?ref=$ref&key=$key" |
                              jq -e --arg key "$key" 'any(.actions_caches[]; .key == $key)' > /dev/null; then
                              found=true
                              break
                          fi
                      done
                      echo "$name ($key): cached=$found"
                      if [ "$found" = false ]; then missing+=("$name"); fi
                  done < <(jq -r 'unique_by(.build)[] | "\(.build) \(.commit)"' <<< "$PINS")
                  # One entry per build: the first run that uses it, which `ensure` builds for.
                  echo "build=$(jq -c --args '$ARGS.positional as $missing | unique_by(.build) | map(select(.build | IN($missing[])))' "${missing[@]}" <<< "$PINS")" >> "$GITHUB_OUTPUT"

    cinnabar-build:
        name: 🔨 Build cinnabar client (${{ matrix.pin.build }})
        needs: changes
        if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.build != '[]' }}
        strategy:
            fail-fast: false
            matrix:
                pin: ${{ fromJSON(needs.changes.outputs.build) }}
        # runs-on: blacksmith-6vcpu-macos-latest
        runs-on: ubuntu-latest
        # A cold build on the four cores `ubuntu-latest` has takes longer than it did on six.
        timeout-minutes: 180
        permissions:
            contents: read
            # Lets the last step delete the builds of commits no protocol pins any more.
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # One entry per commit, so bumping one protocol's pin leaves the others cached, and every
            # protocol and transport that pins a commit shares its entry. The compiled dependencies
            # are keyed by protocol and commit in an entry of their own, so a bump restores its
            # protocol's previous ones first.
            - name: Resolve the cache key
              id: pin
              env:
                  PROTOCOL: ${{ matrix.pin.protocol }}
                  COMMIT: ${{ matrix.pin.commit }}
              run: |
                  echo "key=${RUNNER_OS}-cinnabar-build-${COMMIT}" >> "$GITHUB_OUTPUT"
                  echo "deps-key=${RUNNER_OS}-cinnabar-deps-v${PROTOCOL}-${COMMIT}" >> "$GITHUB_OUTPUT"

            # Only look the entry up: a hit means the build is done, and the e2e job downloads it.
            # The `changes` job already found none, so this guards against a build saved since.
            - name: Look for an existing build
              id: cinnabar-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/${{ matrix.pin.build }}
                  key: ${{ steps.pin.outputs.key }}
                  lookup-only: true

            # Cargo's intermediate directory from the closest earlier build: every third-party crate
            # compiled, which is most of a cold build. Cargo checks registry and git crates by hash,
            # so a pin that keeps a crate's version reuses it and compiles only what changed.
            # Another protocol's entry still holds most of the same crates. Nothing restores the
            # previous build itself, whose directory is named by another commit: these entries are
            # what carry its work forward.
            - name: Restore the compiled dependencies
              id: deps
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar-deps
                  key: ${{ steps.pin.outputs.deps-key }}
                  restore-keys: |
                      ${{ runner.os }}-cinnabar-deps-v${{ matrix.pin.protocol }}-
                      ${{ runner.os }}-cinnabar-deps-

            # A cache restores only to the path it was saved from, and the build directory's path
            # names the commit, so the entry lives at one path and moves into place for the build.
            - name: Put the compiled dependencies in place
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              env:
                  DEPS: ${{ runner.temp }}/jsprismarine/cinnabar-deps
                  BUILD: ${{ runner.temp }}/jsprismarine/cinnabar/${{ matrix.pin.build }}/build
              run: |
                  if [ -d "$DEPS" ] && [ ! -e "$BUILD" ]; then
                      mkdir -p "$(dirname "$BUILD")"
                      mv "$DEPS" "$BUILD"
                      du -sh "$BUILD"
                  else
                      echo 'No compiled dependencies to reuse; this build compiles every crate.'
                  fi

            # Cargo's intermediates reach about 14 GB, more than the runner has free. Its preinstalled
            # Android SDK, .NET, Haskell and CodeQL toolchains are nothing this job uses.
            - name: Free disk space for the build
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              run: |
                  df -h /
                  sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
                  df -h /

            # The headers cinnabar's own Linux CI builds against: Wayland and X11 windows, keyboard
            # layouts, ALSA audio and udev gamepads.
            - name: Install the client's build dependencies
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev mold

            - name: 📦 Install
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              uses: ./.github/common/install

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              with:
                  go-version: 'stable'
                  cache: false

            # Cargo draws its progress bar into the pipe too, and cargo-progress.mjs turns it into a
            # `[cinnabar] 35% · 196/560 units` line at every 5% of the build.
            - name: 🔨 Build the pinned cinnabar client
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              run: |
                  set -o pipefail
                  pnpm --filter @jsprismarine/client-e2e run ensure -- --protocol "$PROTOCOL" --transport "$TRANSPORT" 2>&1 |
                      node .github/scripts/cargo-progress.mjs cinnabar
              env:
                  JSP_CINNABAR_CACHE_DIR: ${{ runner.temp }}/jsprismarine/cinnabar
                  PROTOCOL: ${{ matrix.pin.protocol }}
                  TRANSPORT: ${{ matrix.pin.transport }}
                  # Incremental state only helps the next compile on the same machine, and it
                  # would grow the compiled dependencies' cache entry for nothing.
                  CARGO_INCREMENTAL: '0'
                  # mold links the client's large Bevy binary in a fraction of the default linker's
                  # time. cinnabar's own cargo config sets no rustflags for this one to replace.
                  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
                  CARGO_TERM_PROGRESS_WHEN: always
                  CARGO_TERM_PROGRESS_WIDTH: '120'

            # Only a compile reads cargo's intermediate directory: the e2e jobs need the checkout, the
            # stamp and the three binaries under `target/`, which `ensureBuilt` accepts without it.
            # It moves out of the build's own entry and is saved as the compiled dependencies.
            - name: Move the compiled dependencies out of the build
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              env:
                  DEPS: ${{ runner.temp }}/jsprismarine/cinnabar-deps
                  BUILD: ${{ runner.temp }}/jsprismarine/cinnabar/${{ matrix.pin.build }}/build
              run: |
                  rm -rf "$DEPS"
                  mv "$BUILD" "$DEPS"
                  du -sh "$DEPS"

            # Saved only when this build had no entry of its own, so an exact hit is not uploaded
            # again, and only for the latest protocol's build on master. An entry is 1.8 GB that only the next
            # build reads. Another protocol's build restores the latest one's, which holds most of
            # the same crates, and a pull request's copy would be visible to that pull request
            # alone while pushing master's entries out of the repository's 10 GB of cache.
            - name: Save the compiled dependencies
              if: >-
                  ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' && steps.deps.outputs.cache-hit != 'true'
                  && github.event_name != 'pull_request' && matrix.pin.build == needs.changes.outputs.latest }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar-deps
                  key: ${{ steps.pin.outputs.deps-key }}

            # Save on every ref. A PR's entry is only visible to that PR, which is enough for the
            # e2e jobs below; master's entries are what other PRs fall back to. A pull request builds
            # only when it changes a pin, or when master's entry is gone.
            - name: Save the build
              if: ${{ steps.cinnabar-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/${{ matrix.pin.build }}
                  key: ${{ steps.pin.outputs.key }}

            # A bumped pin leaves its predecessor's build and compiled dependencies behind, and enough
            # of those push the repository over its cache limit, which evicts whichever entry was
            # used least recently. Only master prunes: a pull request that dropped them would take
            # away what other pull requests fall back to. A build stays while any protocol pins its
            # commit, read from cinnabar.json rather than this run's matrix, which a latest-only run
            # narrows.
            - name: Delete the builds of replaced pins
              if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  PROTOCOL: ${{ matrix.pin.protocol }}
                  # Only the latest protocol's build keeps compiled dependencies, so another deletes its own.
                  DEPS_KEY: ${{ matrix.pin.build == needs.changes.outputs.latest && steps.pin.outputs.deps-key || 'none' }}
              run: |
                  pinned="$(jq -c '[.versions[].commit]' tools/client-e2e/cinnabar.json)"
                  delete() { while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done; }
                  prefix="${RUNNER_OS}-cinnabar-build-"
                  gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --limit 100 --json id,key |
                      jq -r --arg prefix "$prefix" --argjson pinned "$pinned" \
                          '.[] | (.key | ltrimstr($prefix)) as $commit
                              | select(($commit | test("^[0-9a-f]{40}$")) and ($pinned | index($commit) | not)) | .id' |
                      delete
                  # Only a key that is the prefix and a commit belongs to this protocol.
                  prefix="${RUNNER_OS}-cinnabar-deps-v${PROTOCOL}-"
                  gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --limit 100 --json id,key |
                      jq -r --arg prefix "$prefix" --arg keep "$DEPS_KEY" \
                          '.[] | select(.key != $keep and (.key | ltrimstr($prefix) | test("^[0-9a-f]{40}$"))) | .id' |
                      delete

    # cinnabar-build still runs on a push that reuses the pull request's results: a pull request's
    # cache entries are invisible to master, so this is where a new pin's build reaches master.
    client-e2e:
        name: >-
            🎮 Client E2E (protocol ${{ matrix.pin.protocol }}${{ matrix.pin.transport == 'nethernet' && ', NetherNet' || '' }})
        needs: [changes, cinnabar-build]
        # A skipped cinnabar-build means every build was already cached.
        if: >-
            ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
            && (needs.cinnabar-build.result == 'success' || needs.cinnabar-build.result == 'skipped')
            && needs.changes.outputs.reused != 'true' }}
        strategy:
            fail-fast: false
            matrix:
                pin: ${{ fromJSON(needs.changes.outputs.pins) }}
        # runs-on: blacksmith-6vcpu-macos-latest
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # The client's shared libraries, plus what lets it draw without a GPU or a screen:
            # lavapipe, Mesa's software Vulkan driver, and Xvfb, a virtual X display.
            - name: Install the client's runtime dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libasound2-dev libudev-dev \
                      libx11-xcb1 libxcursor1 libxi6 libxrandr2 libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb

            # The adapters the client can choose from; lavapipe should be the one listed.
            - name: List the Vulkan adapters
              run: vulkaninfo --summary

            - name: 📦 Install
              uses: ./.github/common/install

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: 'stable'
                  cache: false

            # The cloudburst data pack that `pnpm install` fetches, shared with other runs.
            # The cinnabar build uses a separate cache outside the workspace.
            - name: Cache the fetched sources
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine
                  key: ${{ runner.os }}-jsp-sources-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/pack-hashes.json') }}
                  restore-keys: |
                      ${{ runner.os }}-jsp-sources-

            # The server reads the vanilla datapack (recipes, entities, loot, worldgen) from the
            # data generator's output. Without it the scenarios that need a smelting recipe, a
            # cow or a hoe's farmland run against 0 recipes and 4 entities and fail, and the
            # `worldgen-spawn` suite cannot boot.
            - name: ☕ Setup JDK
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
              with:
                  distribution: temurin
                  java-version: '25'

            - name: Cache generated Java data
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      node_modules/.cache/jsprismarine/java
                      node_modules/.cache/jsprismarine/java-reports
                      node_modules/.cache/jsprismarine/java-structures
                      node_modules/.cache/jsprismarine/vanilla-datapack
                  key: ${{ runner.os }}-jsp-java-data-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/utils/java/**', 'packages/bedrock-data/utils/java-dump/**') }}

            - name: 🏭 Prepare the Java data
              run: pnpm --filter @jsprismarine/bedrock-data run ensure:worldgen

            # The `changes` job found this entry or cinnabar-build saved it, so a miss is a workflow
            # bug, not a reason to compile.
            - name: Restore the cinnabar build
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ runner.temp }}/jsprismarine/cinnabar/${{ matrix.pin.build }}
                  key: ${{ runner.os }}-cinnabar-build-${{ matrix.pin.commit }}
                  fail-on-cache-miss: true

            # A suite is one server and one client, and with no GPU the client renders on the CPU, so
            # each takes about two cores and up to 4 GB (the heap cap below). The runner's own cores
            # and memory decide how many suites start at once; run.mts never runs more than it has.
            - name: Size the suites to the runner
              id: size
              run: |
                  cores="$(nproc)"
                  memory_gb="$(awk '/MemTotal/ { print int($2 / 1048576) }' /proc/meminfo)"
                  suites=$(( cores / 2 < memory_gb / 4 ? cores / 2 : memory_gb / 4 ))
                  suites=$(( suites < 1 ? 1 : suites ))
                  echo "suites=$suites" >> "$GITHUB_OUTPUT"
                  echo "::notice title=Client E2E::$suites suites at once on $cores cores and $memory_gb GB"

            - name: 🎮 Run the client e2e scenarios
              env:
                  # Expands unquoted below: empty vanishes, and scenarios word-split by design.
                  # run.mts calls ensureCinnabar too; it finds the restored build and compiles nothing.
                  JSP_CINNABAR_CACHE_DIR: ${{ runner.temp }}/jsprismarine/cinnabar
                  SCENARIOS: ${{ inputs.scenarios || needs.changes.outputs.scenarios }}
                  PROTOCOL: ${{ matrix.pin.protocol }}
                  TRANSPORT: ${{ matrix.pin.transport }}
                  SUITES: ${{ steps.size.outputs.suites }}
                  NODE_OPTIONS: --max-old-space-size=4096
                  # A client that panics before its control endpoint is up names only its log, so
                  # the panic carries its backtrace there.
                  RUST_BACKTRACE: '1'
              run: |
                  # The clients open their hidden windows on the virtual display xvfb-run starts.
                  # `--retry` runs a failed scenario once more on a fresh server and client, so one
                  # flaky scenario does not cost a rerun of every protocol. It is reported as a
                  # warning and in the summary when it passes the second time.
                  # shellcheck disable=SC2086
                  xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' \
                      pnpm run e2e:client -- --retry --artifacts "$RUNNER_TEMP/client-e2e" --protocol "$PROTOCOL" --transport "$TRANSPORT" --concurrency "$SUITES" $SCENARIOS

            - name: 🔎 Verify client e2e coverage
              id: client-e2e-coverage
              run: node scripts/check-client-e2e-coverage.mts

            # A run of some scenarios covers less than the full run, so it uploads nothing and
            # Codecov carries the last full report forward.
            - name: 🦺 Upload client e2e coverage to Codecov
              if: ${{ !cancelled() && steps.client-e2e-coverage.outcome == 'success' && needs.changes.outputs.scenarios == '' }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: JSPrismarine/JSPrismarine
                  files: coverage/client-e2e/lcov.info
                  disable_search: true
                  # One flag for every protocol, so carryforward keeps one set of e2e coverage on
                  # commits this path-filtered workflow skips; the upload name tells them apart.
                  flags: client-e2e
                  name: client-e2e-${{ matrix.pin.name }}

            # The push to master that merges this pull request skips this job and uploads it.
            - name: 📤 Keep the coverage for the merge
              if: ${{ !cancelled() && steps.client-e2e-coverage.outcome == 'success' && github.event_name == 'pull_request' && needs.changes.outputs.scenarios == '' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: codecov-client-e2e-${{ matrix.pin.name }}
                  path: coverage/client-e2e/lcov.info
                  retention-days: 30

            # A client that exits before its control endpoint is up reports only a log path, inside
            # the cinnabar checkout. This prints each log's end here, where the failure is read.
            - name: 🔎 Show the client logs
              if: ${{ failure() }}
              run: |
                  for log in "$RUNNER_TEMP"/jsprismarine/cinnabar/"$BUILD"/repo/.local/developer-control/logs/*.log; do
                      [ -f "$log" ] || continue
                      echo "::group::$(basename "$log")"
                      tail -n 80 "$log"
                      echo "::endgroup::"
                  done
              env:
                  BUILD: ${{ matrix.pin.build }}

            - name: 📤 Upload evidence
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: client-e2e-evidence-${{ matrix.pin.name }}
                  path: |
                      ${{ runner.temp }}/client-e2e
                      ${{ runner.temp }}/jsprismarine/cinnabar/${{ matrix.pin.build }}/repo/.local/developer-control/logs
                  if-no-files-found: warn

    # The check branch rules require. A matrix job's name depends on its protocols, and a skipped
    # one reports under its unexpanded name, so neither can be required directly.
    client-e2e-passed:
        name: ✅ Client E2E
        needs: [changes, cinnabar-build, client-e2e]
        if: ${{ always() }}
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        steps:
            - name: Check the client e2e results
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: |
                  if [ "$(jq -r '.changes.result' <<< "$NEEDS")" != 'success' ]; then
                      echo 'Could not detect whether code changed.' >&2
                      exit 1
                  fi
                  if [ "$(jq -r '.changes.outputs.code' <<< "$NEEDS")" != 'true' ]; then
                      echo 'Nothing a running server loads changed; the client e2e scenarios were skipped.'
                      exit 0
                  fi
                  jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
                  # cinnabar-build skips when every pin is cached, and client-e2e skips on a push that
                  # reuses the merged pull request's passing runs.
                  jq -e '(.changes.outputs.reused == "true") as $reused
                      | (.changes.outputs.build == "[]") as $cached
                      | to_entries
                      | all(.value.result == "success"
                          or ($cached and .key == "cinnabar-build" and .value.result == "skipped")
                          or ($reused and .key == "client-e2e" and .value.result == "skipped"))' \
                      <<< "$NEEDS" > /dev/null

    # Codecov has no e2e report for a push that skipped the scenarios as already passed, and
    # carryforward would keep the previous master commit's. Upload the pull request run's here.
    reused-coverage:
        name: 🦺 Reuse pull request coverage
        needs: changes
        if: ${{ needs.changes.outputs.reused == 'true' }}
        # runs-on: blacksmith-2vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        steps:
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # An expired artifact leaves Codecov carrying the flag forward, which is no worse than
            # before this job existed.
            - name: ⬇️ Download the pull request coverage
              continue-on-error: true
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: codecov-client-e2e-*
                  path: ${{ runner.temp }}/reused
                  run-id: ${{ needs.changes.outputs.run-id }}
                  github-token: ${{ github.token }}

            - name: List the reports
              id: reports
              run: |
                  files="$(find "$RUNNER_TEMP/reused" -name lcov.info 2> /dev/null | sort | paste -sd, -)"
                  echo "files=$files" >> "$GITHUB_OUTPUT"

            - name: 🦺 Upload client e2e coverage to Codecov
              if: ${{ steps.reports.outputs.files != '' }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: JSPrismarine/JSPrismarine
                  files: ${{ steps.reports.outputs.files }}
                  disable_search: true
                  flags: client-e2e
                  name: client-e2e-reused
