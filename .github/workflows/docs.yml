name: Generate Documentations
env:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master

on:
    # A push run reports on the master commit it publishes; a workflow_run would attach to the default branch head.
    push:
        branches:
            - master

permissions:
    actions: read
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    await-lint:
        name: ⏳ Wait for linting
        runs-on: ubuntu-latest
        steps:
            - name: ⏳ Wait for the Linting run of this commit
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TARGET_SHA: ${{ github.sha }}
              run: |
                  for _ in $(seq 1 30); do
                      run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lint.yml/runs?head_sha=$TARGET_SHA&event=push&branch=master&per_page=100" --jq '.workflow_runs[0].id // ""')"
                      [ -n "$run_id" ] && break
                      sleep 10
                  done
                  [ -n "$run_id" ] || { echo "No Linting run found for $TARGET_SHA" >&2; exit 1; }
                  gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

    build-and-publish-docs:
        name: 📖 Build and Publish Docs
        runs-on: ubuntu-latest
        needs: await-lint
        permissions:
            contents: write
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 📦 Install
              uses: ./.github/common/install

            # The Java data generator needs a JDK of the jar's class file version, and the parity
            # tracker reports "not measured" for every row whose Java or Bedrock sources are missing.
            # The caches use the test workflow's keys, so a master run reuses what it stored.
            # `sources.json` pins Java 26.3, whose `version.json` asks for 25.
            - name: ☕ Setup JDK
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
              with:
                  distribution: temurin
                  java-version: '25'

            - name: Cache the fetched sources
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine
                  key: ${{ runner.os }}-jsp-sources-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/pack-hashes.json') }}
                  restore-keys: |
                      ${{ runner.os }}-jsp-sources-

            # These outputs are derived from the pinned Java source jar and the repository's
            # generator. Restore them before extraction and datagen:java on repeat runs.
            - name: Cache generated Java data
              id: java_data_cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      node_modules/.cache/jsprismarine/java
                      node_modules/.cache/jsprismarine/java-reports
                      node_modules/.cache/jsprismarine/java-structures
                      node_modules/.cache/jsprismarine/vanilla-datapack
                  key: ${{ runner.os }}-jsp-java-data-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/utils/java/**', 'packages/bedrock-data/utils/java-dump/**') }}

            # The fetched-source cache predates the separate generated-data key. On a miss,
            # discard its old generated outputs so datagen cannot mistake them for this key.
            - name: Discard uncached Java data
              if: ${{ steps.java_data_cache.outputs.cache-hit != 'true' }}
              run: |
                  rm -rf node_modules/.cache/jsprismarine/java-reports
                  rm -rf node_modules/.cache/jsprismarine/java-structures
                  rm -rf node_modules/.cache/jsprismarine/vanilla-datapack
                  rm -rf node_modules/.cache/jsprismarine/java/*/dump-classes
                  rm -rf node_modules/.cache/jsprismarine/java/*/dump-out

            - name: 📖 Build docs
              env:
                  # The contributors page reads GitHub's contributor list at build time.
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm run build:docs

            - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./tools/docs/site/.vitepress/dist
                  enable_jekyll: false
                  commit_message: ${{ github.event.head_commit.message }}
