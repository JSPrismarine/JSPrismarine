name: Generate Documentations
env:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master
    # The Cloudflare Pages project that serves the site. This workflow uploads every deployment to it,
    # the site from master and each pull request's preview, so Cloudflare builds nothing itself.
    PAGES_PROJECT: jsprismarine
    # The branch name the project's settings call production. An upload under it replaces the live
    # site; any other name is a preview. It names no branch in this repository: the site used to be
    # pushed to one, and Cloudflare built each push, so a failed build failed no workflow (#3064).
    PAGES_PRODUCTION_BRANCH: gh-pages

on:
    # A push run reports on the master commit it publishes; a workflow_run would attach to the default branch head.
    push:
        branches:
            - master
    # Previews cover changes to the site's own pages and theme. Package sources also feed the API
    # reference, the docs facts and the parity tracker, but a change there alone builds no preview.
    pull_request:
        types: [opened, reopened, synchronize, closed]
        paths:
            - 'docs/**'
            # Contributor-only notes the site leaves out.
            - '!docs/design/**'
            - 'tools/docs/**'
            - 'CONTRIBUTING.md'
            - 'CODE_OF_CONDUCT.md'
            - '.github/workflows/docs.yml'

permissions:
    actions: read
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

jobs:
    # The build does not wait for linting: only publishing does, as its first step, so a long lint
    # run overlaps with the build instead of adding to it and no runner sits waiting meanwhile.
    build-docs:
        name: 📖 Build Docs
        # A closed pull request only has its preview removed. A fork's token cannot push a preview.
        if: >-
            github.event_name == 'push' ||
            (github.event.action != 'closed' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        # runs-on: blacksmith-4vcpu-ubuntu-2404
        runs-on: ubuntu-latest
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        steps:
            # - uses: useblacksmith/checkout@v1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # Full history and tags: each page's "Updated" date is its source's last commit, and
                  # the releases page dates each version by its tag. A shallow clone dates every page
                  # by the newest commit.
                  fetch-depth: 0

            - name: 📦 Install
              uses: ./.github/common/install

            # The Java data generator needs a JDK of the jar's class file version, and the parity
            # tracker reports "not measured" for every row whose Java or Bedrock sources are missing.
            # The caches use the test workflow's keys, so a master run reuses what it stored.
            # `sources.json` pins Java 26.3, whose `version.json` asks for 25.
            - name: ☕ Setup JDK
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
              with:
                  distribution: temurin
                  java-version: '25'

            - name: Cache the fetched sources
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.cache/jsprismarine
                  key: ${{ runner.os }}-jsp-sources-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/pack-hashes.json') }}
                  restore-keys: |
                      ${{ runner.os }}-jsp-sources-

            # These outputs are derived from the pinned Java source jar and the repository's
            # generator. Restore them before extraction and datagen:java on repeat runs.
            - name: Cache generated Java data
              id: java_data_cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      node_modules/.cache/jsprismarine/java
                      node_modules/.cache/jsprismarine/java-reports
                      node_modules/.cache/jsprismarine/java-structures
                      node_modules/.cache/jsprismarine/vanilla-datapack
                  key: ${{ runner.os }}-jsp-java-data-${{ hashFiles('packages/bedrock-data/sources.json', 'packages/bedrock-data/utils/java/**', 'packages/bedrock-data/utils/java-dump/**') }}

            # The fetched-source cache predates the separate generated-data key. On a miss,
            # discard its old generated outputs so datagen cannot mistake them for this key.
            - name: Discard uncached Java data
              if: ${{ steps.java_data_cache.outputs.cache-hit != 'true' }}
              run: |
                  rm -rf node_modules/.cache/jsprismarine/java-reports
                  rm -rf node_modules/.cache/jsprismarine/java-structures
                  rm -rf node_modules/.cache/jsprismarine/vanilla-datapack
                  rm -rf node_modules/.cache/jsprismarine/java/*/dump-classes
                  rm -rf node_modules/.cache/jsprismarine/java/*/dump-out

            - name: 📖 Build docs
              env:
                  # The contributors page reads GitHub's contributor list at build time.
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm run build:docs

            - name: 🚚 Upload the built site
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: docs-site
                  path: tools/docs/site/.vitepress/dist
                  if-no-files-found: error

    publish-docs:
        name: 🚀 Publish Docs
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        needs: build-docs
        permissions:
            # Reading this commit's Linting run.
            actions: read
            contents: read
        steps:
            # Linting has usually finished by the time the site is built. A failed run fails this step.
            - name: ⏳ Wait for the Linting run of this commit
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TARGET_SHA: ${{ github.sha }}
              run: |
                  for _ in $(seq 1 30); do
                      run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lint.yml/runs?head_sha=$TARGET_SHA&event=push&branch=master&per_page=100" --jq '.workflow_runs[0].id // ""')"
                      [ -n "$run_id" ] && break
                      sleep 10
                  done
                  [ -n "$run_id" ] || { echo "No Linting run found for $TARGET_SHA" >&2; exit 1; }
                  gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

            - name: 📥 Download the built site
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: docs-site
                  path: docs-site

            # Uploaded from here rather than built by Cloudflare, so a deployment Cloudflare refuses,
            # such as one of more than 20,000 files or with a file over 25 MiB, fails this job and the
            # run of the master commit it came from. An upload also uses none of the account's builds.
            - name: 🚀 Upload the site
              uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  # The job checks nothing out, so no lockfile says which package manager installs Wrangler.
                  packageManager: npm
                  command: >-
                      pages deploy docs-site
                      --project-name=${{ env.PAGES_PROJECT }}
                      --branch=${{ env.PAGES_PRODUCTION_BRANCH }}
                      --commit-hash=${{ github.sha }}

    preview-docs:
        name: 🔎 Preview Docs
        # Runs without a build when the pull request closes, to delete its preview.
        if: >-
            !cancelled() &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            (github.event.action == 'closed' || needs.build-docs.result == 'success')
        runs-on: ubuntu-latest
        needs: build-docs
        permissions:
            pull-requests: write
        steps:
            - name: 📥 Download the built site
              if: github.event.action != 'closed'
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: docs-site
                  path: docs-site

            # The preview comment names the deployment it links to, on a line GitHub does not render.
            # Only a comment from GitHub Actions counts, so nobody else can name a deployment to delete.
            - name: Find the deployment the last run uploaded
              id: previous
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PULL_REQUEST: ${{ github.event.number }}
              run: |
                  deployments="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments" --paginate \
                      --jq '.[] | select(.user.login == "github-actions[bot]") | .body | scan("<!-- deployment ([0-9a-f-]{36}) -->") | .[0]')"
                  echo "deployment=$(tail -n 1 <<< "$deployments")" >> "$GITHUB_OUTPUT"

            # A deployment of any branch but the project's production branch is a preview, which
            # Cloudflare serves at <branch>.<project>.pages.dev. Each pull request gets a branch name of
            # its own, so Cloudflare counts a preview's files against that preview alone.
            - name: 🚀 Upload the preview
              id: upload
              if: github.event.action != 'closed'
              uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  # The job checks nothing out, so no lockfile says which package manager installs Wrangler.
                  packageManager: npm
                  command: >-
                      pages deploy docs-site
                      --project-name=${{ env.PAGES_PROJECT }}
                      --branch=pr-${{ github.event.number }}
                      --commit-hash=${{ github.event.pull_request.head.sha }}

            # An upload replaces the deployment before it, and a closed pull request keeps none. A
            # replaced deployment that survives is a copy nothing links to, so only a failure to delete
            # a closed pull request's preview fails the job. Cloudflare deletes a deployment that a
            # branch address still points at only when forced.
            - name: Delete the deployment the last run uploaded
              if: steps.previous.outputs.deployment != ''
              continue-on-error: ${{ github.event.action != 'closed' }}
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  DEPLOYMENT: ${{ steps.previous.outputs.deployment }}
              run: |
                  curl --fail-with-body --silent --show-error --request DELETE \
                      --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                      "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/deployments/$DEPLOYMENT?force=true"

            # The header is the one rossjrw/pr-preview-action used, so a comment it left is updated in place.
            - name: 💬 Link the preview
              if: github.event.action != 'closed'
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  header: pr-preview
                  message: |
                      Docs preview: ${{ steps.upload.outputs.pages-deployment-alias-url || steps.upload.outputs.deployment-url }}

                      Built from ${{ github.event.pull_request.head.sha }}. Each push replaces it, and closing the pull request deletes it.
                      <!-- deployment ${{ steps.upload.outputs.pages-deployment-id }} -->

            - name: 💬 Say the preview is gone
              if: github.event.action == 'closed'
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  header: pr-preview
                  # A pull request that never had a preview gets no comment about one.
                  only_update: true
                  message: Closing this pull request deleted its docs preview.
