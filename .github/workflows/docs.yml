name: Generate Documentations
env:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master

on:
    workflow_run:
        workflows: ['Linting']
        types: [completed]
        branches: [master]

permissions:
    actions: read
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    find-client-e2e:
        name: 🔎 Find existing client e2e artifact
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        outputs:
            run_id: ${{ steps.find.outputs.run_id }}
        steps:
            - name: 🔎 Locate client e2e run for this commit
              id: find
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/client-e2e.yml/runs?head_sha=$TARGET_SHA&event=push&branch=master&per_page=100" --jq '.workflow_runs[0].id // ""')"
                  echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

    await-client-e2e:
        name: ⏳ Wait for existing client e2e run
        if: needs.find-client-e2e.outputs.run_id != ''
        needs: find-client-e2e
        runs-on: ubuntu-latest
        steps:
            - name: ⏳ Wait for the matching client e2e run
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RUN_ID: ${{ needs.find-client-e2e.outputs.run_id }}
              run: gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

    parity-evidence:
        name: 🎬 Record parity evidence
        if: ${{ github.event.workflow_run.conclusion == 'success' && needs.find-client-e2e.outputs.run_id == '' }}
        needs: find-client-e2e
        uses: ./.github/workflows/client-e2e.yml
        with:
            scenarios: ender-dragon
            record: true
            latest_only: true
        secrets: inherit

    build-and-publish-docs:
        name: 📖 Build and Publish Docs
        runs-on: ubuntu-latest
        if: ${{ always() && github.event.workflow_run.conclusion == 'success' && (needs.await-client-e2e.result == 'success' || needs.parity-evidence.result == 'success') }}
        needs: [find-client-e2e, await-client-e2e, parity-evidence]
        permissions:
            actions: read
            contents: write
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 📦 Install
              uses: ./.github/common/install

            - name: 🧭 Read latest supported protocol
              id: protocol
              run: |
                  node --input-type=module -e 'import fs from "node:fs"; const { bds } = JSON.parse(fs.readFileSync("packages/bedrock-data/sources.json", "utf8")); const protocols = Object.keys(bds.versions).map(Number).sort((a, b) => a - b); if (protocols.length === 0) throw new Error("No supported Bedrock protocols are configured"); console.log("latest=" + protocols.at(-1));' >> "$GITHUB_OUTPUT"

            - name: 📥 Download latest-protocol client evidence
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: client-e2e-evidence-protocol-${{ steps.protocol.outputs.latest }}
                  run-id: ${{ needs.find-client-e2e.outputs.run_id || github.run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  path: ${{ runner.temp }}/parity-evidence

            - name: 🎞️ Stage parity evidence for GitHub Pages
              run: |
                  mkdir -p tools/docs/site/public/parity-evidence
                  cp "$RUNNER_TEMP/parity-evidence/ender-dragon/run.mp4" tools/docs/site/public/parity-evidence/ender-dragon.mp4
                  cp "$RUNNER_TEMP/parity-evidence/ender-dragon/fountain.png" tools/docs/site/public/parity-evidence/ender-dragon.png

            - name: 📖 Build docs with CI-generated parity evidence
              run: pnpm run build:docs
              env:
                  PARITY_EVIDENCE_REQUIRED: 'true'

            - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./tools/docs/site/.vitepress/dist
                  enable_jekyll: false
                  commit_message: ${{ github.event.workflow_run.head_commit.message }}
