name: Native network

# Builds @jsprismarine/native-network's library for every platform it ships.
# native-library.yml builds, tests and publishes it; this workflow says when.
on:
    pull_request:
        paths:
            - 'packages/native-network/**'
            - 'packages/native-library/**'
            - 'scripts/native/**'
            - '.github/workflows/native-network.yml'
            - '.github/workflows/native-library.yml'
            - '.github/common/native-library/**'
            - '.github/common/mingw/**'
    push:
        branches:
            - master
        paths:
            - 'packages/native-network/**'
            - 'packages/native-library/**'
            - 'scripts/native/**'
            - '.github/workflows/native-network.yml'
            - '.github/workflows/native-library.yml'
    workflow_dispatch:
        inputs:
            publish:
                description: 'Attach the builds to a release and commit the manifest to this branch'
                required: false
                type: boolean
                default: false

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    native:
        name: Native
        # The release pull request changes only the package's version and changelog, which no build
        # reads. Skipping the builds skips every job after them.
        if: ${{ github.head_ref != 'changeset-release/master' }}
        uses: ./.github/workflows/native-library.yml
        # The publish job attaches builds to a release and pushes the manifest.
        permissions:
            contents: write
        secrets: inherit
        with:
            package: native-network
            publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
