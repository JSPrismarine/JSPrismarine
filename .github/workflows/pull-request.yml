name: PRs

env:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master

on:
    pull_request:
        types: [opened, synchronize, labeled]

jobs:
    renovate:
        name: 🔍 Update Lockfile & Add Changeset
        runs-on: ubuntu-latest
        if: contains(github.event.pull_request.labels.*.name, 'Dependency')

        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  ref: ${{github.event.pull_request.head.ref}}
                  repository: ${{github.event.pull_request.head.repo.full_name}}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: 📦 Install
              uses: ./.github/common/install

            - name: 🚚 Update PR
              uses: mscharley/dependency-changesets-action@874dac2372a085cb94f750e8bdf5b1173a838a75 # v1.2.5
              with:
                  use-conventional-commits: false
                  commit-message: 'deps: Add changeset.'
                  token: ${{ secrets.GITHUB_TOKEN }}
