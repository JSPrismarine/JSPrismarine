name: PRs

env:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master

on:
    pull_request:
        types: [opened, synchronize, labeled]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    renovate:
        name: 🔍 Update Lockfile & Add Changeset
        runs-on: ubuntu-latest
        if: contains(github.event.pull_request.labels.*.name, 'Dependency')

        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  # No old file contents, which are nearly all of the repository's 2 GB.
                  # Git fetches a blob a command needs on demand.
                  filter: blob:none
                  ref: ${{github.event.pull_request.head.ref}}
                  repository: ${{github.event.pull_request.head.repo.full_name}}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: 📦 Install
              uses: ./.github/common/install

            - name: 🚚 Update PR
              uses: mscharley/dependency-changesets-action@874dac2372a085cb94f750e8bdf5b1173a838a75 # v1.2.5
              with:
                  use-conventional-commits: false
                  commit-message: 'chore(deps): add changeset'
                  token: ${{ secrets.GITHUB_TOKEN }}

            # The action names every package whose manifest changed, addons included. Changesets
            # does not release an addon's private, unversioned scripts package, and refuses a
            # changeset that names one beside a package it releases, which stopped the release.
            - name: 🧹 Drop unreleased packages from the changeset
              env:
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: |
                  git pull --ff-only origin "$HEAD_REF"
                  node scripts/check-changesets.mts --fix
                  if [ -n "$(git status --porcelain .changeset)" ]; then
                      git config user.name 'github-actions[bot]'
                      git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                      git add -A .changeset
                      git commit -m 'chore(deps): leave unreleased packages out of the changeset'
                      git push origin "HEAD:$HEAD_REF"
                  fi
